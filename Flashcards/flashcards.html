<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alien Baby — Flashcards</title>
<!-- KaTeX for math rendering. CDN-only dependency: math needs a network connection;
     the deck, flipping, and drill-down all still work offline via file://. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.10);
    --border-med: rgba(0,0,0,0.18);
    --text: #1a1917;
    --text-muted: #6b6a65;
    --text-hint: #a09e98;
    --green: #1a7a57;
    --green-bg: #e8f5ee;
    --red: #b83c1e;
    --red-bg: #faeae5;
    --accent: #2d4a8a;
    --accent-bg: #eaeefc;
    --radius: 14px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --surface: #1f1e1b;
      --surface2: #2a2926;
      --border: rgba(255,255,255,0.08);
      --border-med: rgba(255,255,255,0.14);
      --text: #f0efe9;
      --text-muted: #9b9990;
      --text-hint: #5e5d58;
      --green: #3ecf8e;
      --green-bg: #0d2e1f;
      --red: #e8705a;
      --red-bg: #2e1108;
      --accent: #7c9ef5;
      --accent-bg: #0f1a3a;
    }
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    min-height: 100vh;
    max-width: 540px;
    margin: 0 auto;
    padding: 1.25rem 1rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0.25rem 0; }
  .header h1 { font-size: 15px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.02em; }
  .mode-btn {
    font-size: 13px; background: var(--surface2); border: 0.5px solid var(--border-med);
    border-radius: 20px; padding: 4px 12px; cursor: pointer; color: var(--text-muted);
    font-family: inherit;
  }
  .mode-btn:hover { background: var(--surface); }

  /* Stats row */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 0.6rem 0.75rem; text-align: center;
  }
  .stat-label { font-size: 11px; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  .stat-val { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat-val.g { color: var(--green); }
  .stat-val.r { color: var(--red); }

  /* Progress */
  .progress-wrap { background: var(--surface2); border-radius: 99px; height: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.5s ease; }

  /* Card flip area */
  .card-wrap { perspective: 1200px; cursor: pointer; flex: 1; min-height: 260px; }
  .card-inner {
    position: relative; width: 100%; height: 100%; min-height: 260px;
    transition: transform 0.5s cubic-bezier(.4,0,.2,1);
    transform-style: preserve-3d;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0;
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem 1.5rem 1.25rem;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  .card-face.back { transform: rotateY(180deg); background: var(--surface); }
  .card-chip {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 20px; margin-bottom: 1rem;
  }
  .chip-q { background: var(--accent-bg); color: var(--accent); }
  .chip-a { background: var(--green-bg); color: var(--green); }
  .card-section {
    font-size: 10px; font-weight: 500; color: var(--text-hint); letter-spacing: 0.05em;
    text-transform: uppercase; margin-bottom: 0.6rem;
  }
  .card-text { font-size: 16px; color: var(--text); line-height: 1.65; }
  .card-hint {
    margin-top: 1rem; font-size: 12px; color: var(--text-hint);
    display: flex; align-items: center; gap: 5px;
  }

  /* Action buttons */
  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 0.7rem 1rem; border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-med); background: var(--surface);
    color: var(--text); font-size: 15px; font-family: inherit;
    cursor: pointer; transition: all 0.15s; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { background: var(--surface2); }
  .btn:active { transform: scale(0.97); }
  .btn.wrong { border-color: var(--red); color: var(--red); }
  .btn.wrong:hover { background: var(--red-bg); }
  .btn.correct { border-color: var(--green); color: var(--green); }
  .btn.correct:hover { background: var(--green-bg); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: var(--accent-bg); }
  .btn.wide { flex: none; width: 100%; }

  .counter { text-align: center; font-size: 13px; color: var(--text-hint); }
  .hidden { display: none !important; }

  /* Done screen */
  .done-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 2rem 1rem; gap: 1rem;
  }
  .done-icon { font-size: 48px; margin-bottom: 0.5rem; }
  .done-screen h2 { font-size: 22px; font-weight: 600; }
  .done-screen p { color: var(--text-muted); font-size: 15px; max-width: 320px; line-height: 1.6; }

  /* Section filter */
  .filter-area { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    border: 0.5px solid var(--border-med); background: var(--surface);
    color: var(--text-muted); cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .filter-btn.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  .filter-btn:hover { background: var(--surface2); }
  .section-label {
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }

  /* Add-card modal */
  .header-btns { display: flex; gap: 8px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem; z-index: 50;
  }
  .modal {
    background: var(--surface); border: 0.5px solid var(--border-med);
    border-radius: var(--radius); padding: 1.25rem; width: 100%; max-width: 460px;
    display: flex; flex-direction: column; gap: 0.75rem;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 16px; font-weight: 600; color: var(--text); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .modal input, .modal textarea, .modal select {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--text);
    background: var(--surface2); border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm); padding: 0.6rem 0.7rem; resize: vertical;
  }
  .modal textarea { min-height: 64px; line-height: 1.5; }

  /* Tappable glossary term (auto-linked in card q/a text) */
  .term {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: var(--border-med);
    text-underline-offset: 2px;
    text-decoration-thickness: 1px;
    cursor: pointer;
  }
  .term:hover { text-decoration-color: var(--accent); }

  /* Drill-down bottom sheet */
  .drill-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 60;
  }
  .drill-sheet {
    background: var(--surface); border: 0.5px solid var(--border-med);
    border-top-left-radius: var(--radius); border-top-right-radius: var(--radius);
    width: 100%; max-width: 540px;
    padding: 1.1rem 1.25rem 1.25rem;
    display: flex; flex-direction: column; gap: 0.65rem;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
  }
  @media (min-width: 560px) {
    .drill-backdrop { align-items: center; }
    .drill-sheet { border-radius: var(--radius); }
  }
  .drill-breadcrumb {
    font-size: 11px; color: var(--text-hint); letter-spacing: 0.03em;
    word-break: break-word;
  }
  .drill-breadcrumb .crumb-sep { color: var(--text-hint); margin: 0 4px; }
  .drill-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .drill-level-label {
    font-size: 10px; font-weight: 600; color: var(--text-hint);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .drill-body { font-size: 15px; color: var(--text); line-height: 1.6; }
  .drill-body .term { color: var(--accent); }
  .drill-controls { display: flex; gap: 8px; margin-top: 0.4rem; }
  .drill-controls .btn { font-size: 13px; padding: 0.55rem 0.8rem; }

  @media (max-width: 420px) {
    #app { padding: 1rem 0.75rem 2rem; }
    .card-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Alien Baby</h1>
    <div class="header-btns">
      <button class="mode-btn" onclick="openAddModal()">＋ Add</button>
      <button class="mode-btn" id="filter-toggle" onclick="toggleFilterPanel()">Filter sections ▾</button>
    </div>
  </div>

  <div id="filter-panel" class="hidden">
    <div class="section-label">Study by section</div>
    <div class="filter-area" id="filter-btns"></div>
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button class="btn" style="flex:1; font-size:13px;" onclick="selectAll()">All</button>
      <button class="btn" style="flex:1; font-size:13px;" onclick="selectNone()">None</button>
      <button class="btn primary" style="flex:1; font-size:13px;" onclick="applyFilter()">Study →</button>
    </div>
    <div style="margin-top:8px;">
      <button class="btn" style="width:100%; font-size:13px;" id="export-btn" onclick="exportCards()">Export added cards</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Remaining</div><div class="stat-val" id="s-remaining">0</div></div>
    <div class="stat"><div class="stat-label">Correct</div><div class="stat-val g" id="s-correct">0</div></div>
    <div class="stat"><div class="stat-label">Review</div><div class="stat-val r" id="s-wrong">0</div></div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="progress" style="width:0%"></div></div>

  <div id="study-view" style="display:flex; flex-direction:column; gap:1rem; flex:1;">
    <div class="card-wrap" id="card-wrap" onclick="flip()">
      <div class="card-inner" id="card-inner">
        <div class="card-face front">
          <span class="card-chip chip-q">Question</span>
          <div class="card-section" id="card-section"></div>
          <div class="card-text" id="q-text"></div>
          <div class="card-hint">↕ tap to flip</div>
        </div>
        <div class="card-face back">
          <span class="card-chip chip-a">Answer</span>
          <div class="card-section" id="card-section-back"></div>
          <div class="card-text" id="a-text"></div>
        </div>
      </div>
    </div>

    <div class="actions hidden" id="actions">
      <button class="btn wrong" onclick="mark(false)">✗ Still learning</button>
      <button class="btn correct" onclick="mark(true)">✓ Got it</button>
    </div>
    <div class="actions hidden" id="followup-row">
      <button class="btn" style="font-size:13px;" onclick="openAddModal(current ? current.s : null)">＋ Add a follow-up card</button>
    </div>
    <div class="actions" id="flip-btn-row">
      <button class="btn primary wide" onclick="flip()">Flip card</button>
    </div>
    <div class="counter" id="counter"></div>
  </div>

  <div id="done-view" class="done-screen hidden">
    <div class="done-icon" id="done-icon">🎉</div>
    <h2 id="done-title"></h2>
    <p id="done-msg"></p>
    <button class="btn primary" style="max-width:240px; margin-top:0.5rem;" onclick="restart()">Next round →</button>
  </div>

  <div id="drill-backdrop" class="drill-backdrop hidden" onclick="closeDrill(event)">
    <div class="drill-sheet" onclick="event.stopPropagation()">
      <div class="drill-breadcrumb" id="drill-breadcrumb"></div>
      <div class="drill-title" id="drill-title"></div>
      <div class="drill-level-label" id="drill-level-label"></div>
      <div class="drill-body" id="drill-body"></div>
      <div class="drill-controls">
        <button class="btn" id="drill-back" onclick="drillBack()">← Back</button>
        <button class="btn primary" id="drill-deeper" onclick="deeper()">Go deeper ↓</button>
        <button class="btn" onclick="closeDrill()">Close</button>
      </div>
    </div>
  </div>

  <div id="add-modal" class="overlay hidden">
    <div class="modal">
      <h3 id="add-title">Add a card</h3>
      <div class="field">
        <label>Section</label>
        <select id="add-section" onchange="onSectionChange()"></select>
      </div>
      <div class="field hidden" id="new-section-field">
        <label>New section name</label>
        <input id="add-new-section" placeholder="e.g. My follow-ups">
      </div>
      <div class="field">
        <label>Question</label>
        <textarea id="add-q" placeholder="What is efficient pathing?"></textarea>
      </div>
      <div class="field">
        <label>Answer</label>
        <textarea id="add-a" placeholder="The shortest / least-wasteful route the agent takes to the target."></textarea>
      </div>
      <div class="actions" style="margin-top:4px;">
        <button class="btn" onclick="closeAddModal()">Cancel</button>
        <button class="btn primary" onclick="saveNewCard()">Save card</button>
      </div>
    </div>
  </div>
</div>

<script>
const ALL_CARDS = [
  // ── Intro basics (conversation-derived; not in FLASHCARDS.md) ──
  {s:"Basics", q:"What does 'R' stand for in the experiment log (e.g. R3, R20)?", a:"The experiment number. R3 = the third experiment run, R20 = the twentieth."},
  {s:"Basics", q:"What does 't' represent in the log (e.g. t=14999)?", a:"Time / steps — the number of individual actions the agent has performed in that experiment."},
  {s:"Basics", q:"What does a 'Hits' score of 20/20 mean?", a:"The agent successfully touched both target balls in every single trial — a perfect result."},
  {s:"Basics", q:"What does the ± symbol mean in a result like '252 ± 10'?", a:"Margin of error. The score was consistently between 242 and 262 across multiple runs, proving the result isn't a fluke."},
  {s:"Basics", q:"What is a 'Seed' in the context of these experiments?", a:"A starting number used to generate randomness. The same seed always produces identical randomness, so different seeds confirm the result isn't due to a lucky pattern."},
  {s:"Basics", q:"What are the three types of reward signals in the scoring system?", a:"(1) Contact reward — touching the ball. (2) Approach reward — getting closer to the ball. (3) Velocity/efficiency penalty — penalises erratic movement."},
  {s:"Basics", q:"Is there a fixed 'perfect score' in this RL environment?", a:"No theoretical maximum exists, but 'perfect' in practice means 100% hit rate, efficient pathing, and stable contact."},
  {s:"Basics", q:"What is a Reward Function?", a:"The mathematical formula defining what behaviour earns points. It communicates the goal to the agent without giving explicit instructions."},
  {s:"Basics", q:"What is the difference between a sparse and a dense reward?", a:"Sparse: given only on a specific event (e.g. touching the ball) — rare but high-value. Dense: given continuously for incremental progress (e.g. getting closer)."},
  {s:"Basics", q:"What is the Policy (π)?", a:"The agent's strategy — the learned mapping from states to actions. It is the 'rulebook' encoded in the network weights."},
  {s:"Basics", q:"What is the State (s)?", a:"The current configuration of the agent and environment — all sensory information the agent uses to decide its next action."},
  {s:"Basics", q:"What is Reinforcement Learning (RL)?", a:"A framework where an agent learns to make decisions by interacting with an environment and receiving reward signals — no explicit programmed rules, only trial and error."},

  // ── Reinforcement learning — algorithm side ──
  {s:"Reinforcement learning — algorithm side", q:"What is SAC?", a:"Soft Actor-Critic. The RL algorithm used here. Modern off-policy method for continuous-action problems (joint torques). \"Soft\" because it rewards keeping randomness in the policy, which discourages premature lock-in to one strategy."},
  {s:"Reinforcement learning — algorithm side", q:"What is the \"actor\" in SAC?", a:"The neural network that chooses actions. Input is the observation (proprio + pixels); output is a distribution over actions. In this project a small MLP: obs → 256 → 256 → action."},
  {s:"Reinforcement learning — algorithm side", q:"What is the \"critic\" in SAC?", a:"A second network that estimates \"how good was that action in that state?\" — a scalar value. SAC uses two critics and takes the minimum to prevent over-trusting its own value estimates. The actor learns to pick actions the critic rates highly."},
  {s:"Reinforcement learning — algorithm side", q:"Why does SAC use two critics?", a:"Taking the minimum of two value estimates prevents the actor from over-trusting an over-optimistic critic (a known instability in Q-learning). It's a standard trick called Clipped Double Q-learning."},
  {s:"Reinforcement learning — algorithm side", q:"What is a \"policy\"?", a:"The rule that maps observations to actions — the creature's moment-to-moment behavior strategy. In code the policy is the actor network. \"Running the policy\" = executing that mapping step by step."},
  {s:"Reinforcement learning — algorithm side", q:"What is an episode?", a:"One trial: reset the environment, let the agent act for up to N timesteps or until termination (e.g., touching the target or falling). One full reset-to-termination run."},
  {s:"Reinforcement learning — algorithm side", q:"What is a timestep / step?", a:"One full decision cycle: agent sees obs → picks action → env advances physics → returns new obs, reward, done. In this env one step = 5 internal physics substeps of 0.01 s = 50 ms of simulated time."},
  {s:"Reinforcement learning — algorithm side", q:"How is \"step\" different from \"sim-timestep\"?", a:"A sim-timestep is 0.01 s of physics. A step bundles 5 of those = 50 ms. The agent decides every 50 ms; physics is computed every 10 ms."},
  {s:"Reinforcement learning — algorithm side", q:"How does \"step\" differ from \"episode\"?", a:"An episode is a full reset-to-termination run (up to 400 or 2000 steps depending on env). A step is one decision cycle inside an episode."},
  {s:"Reinforcement learning — algorithm side", q:"What is a \"rollout\"?", a:"A sequence of timesteps, usually a full episode or batch of episodes. \"Roll out the policy\" = run it in the env and record what happens."},
  {s:"Reinforcement learning — algorithm side", q:"What is a replay buffer?", a:"A rolling cache of the last ~50,000 transitions (state, action, reward, next_state) the agent has experienced. SAC learns off-policy: it samples random old transitions to update on, not only the latest episode. This is why the agent keeps improving long after behavior has changed."},
  {s:"Reinforcement learning — algorithm side", q:"What is on-policy vs off-policy learning?", a:"On-policy = learn only from data generated by the current policy (e.g., PPO). Off-policy = learn from any past data, including old policies' rollouts (e.g., SAC). Off-policy is more sample-efficient but can be less stable."},
  {s:"Reinforcement learning — algorithm side", q:"What is a SAC update batch / gradient step?", a:"Once per env timestep, SAC pulls 256 random transitions from the replay buffer and does one gradient update on actor and critic. \"Batch\" here is the 256 samples, not a batch of episodes."},
  {s:"Reinforcement learning — algorithm side", q:"What is a checkpoint?", a:"A saved copy of the trained model (weights + optimizer state). Can be loaded later to resume training or evaluate. In this project they live under `alien_baby/results/`."},
  {s:"Reinforcement learning — algorithm side", q:"What is deterministic vs stochastic evaluation?", a:"During training the actor samples actions from a distribution (stochastic) to explore. During eval we use `deterministic=True`, which takes the distribution's mean — stable, repeatable behavior."},
  {s:"Reinforcement learning — algorithm side", q:"What is the entropy coefficient (ent_coef / α / \"temperature\")?", a:"SAC's knob for how much randomness it encourages in the actor. Higher = more exploration; lower = more committed actions. SAC can tune it automatically. Logged as `ent_coef`."},
  {s:"Reinforcement learning — algorithm side", q:"What is entropy annealing?", a:"Starting training with a high entropy coefficient (lots of exploration) and gradually lowering it as training progresses (commit to learned behavior). In Phase XII: 0.5 → 0.2 over steps 15K–30K."},
  {s:"Reinforcement learning — algorithm side", q:"What is the Polyak update / target network?", a:"A stability trick. The critic has a \"shadow\" target whose weights slowly drift toward the main critic's (τ=0.005 per update). The main critic trains against the slowly-updating target, preventing runaway feedback loops."},
  {s:"Reinforcement learning — algorithm side", q:"What is \"warm-start\" in training?", a:"Initializing a new run from a previous checkpoint's weights rather than from scratch. In this project R40's warm-start is noted as broken because `SAC.load` strips the MICOA training step."},
  {s:"Reinforcement learning — algorithm side", q:"What is a curriculum?", a:"Gradually increasing task difficulty during training. In Phase XII: ball offset ramps from 0 up to 0.15 m over steps 2000–15000, then locks."},
  {s:"Reinforcement learning — algorithm side", q:"What is curriculum lock?", a:"The point in training where the curriculum stops ramping and the task is at full difficulty. In Phase XII that's around step 15K. Often where collapse happens because the policy was relying on easier early targets."},

  // ── Neural-network plumbing ──
  {s:"Neural-network plumbing", q:"What is an MLP?", a:"Multi-Layer Perceptron. A plain feed-forward neural network: stack of linear layers with non-linearities between them. No attention, no recurrence — just matrix multiplies and ReLUs."},
  {s:"Neural-network plumbing", q:"What is a Linear layer?", a:"A matrix multiply plus a bias vector: `y = W·x + b`. The \"weights\" W are what training updates."},
  {s:"Neural-network plumbing", q:"What is ReLU?", a:"`max(0, x)` applied element-wise. The most common non-linearity. Without a non-linearity, stacking linear layers would collapse to a single linear map."},
  {s:"Neural-network plumbing", q:"What is a hidden activation?", a:"The intermediate vector produced by a layer. `hidden1` = the output of the first Linear+ReLU. It's the network's internal \"picture\" of the state at that depth."},
  {s:"Neural-network plumbing", q:"What is a feature extractor?", a:"The part of the network that turns raw observations into a feature vector for the policy to consume. For pure proprio it's just identity (flatten). For vision it's typically a CNN."},
  {s:"Neural-network plumbing", q:"What is latent space?", a:"An abstract vector space the network uses internally to represent state, often lower-dimensional than the raw input. Points in latent space have no direct sensory meaning; they're whatever the encoder learned is useful. MICOA's shared latent Z is 64-dim and represents \"world state both modalities are seeing.\""},
  {s:"Neural-network plumbing", q:"Why is latent space called \"latent\"?", a:"\"Latent\" = hidden, not directly observed. The space exists only inside the network; you can't measure it externally. Compare to \"observation space\" (the raw inputs) and \"action space\" (the outputs)."},
  {s:"Neural-network plumbing", q:"What does \"freezing weights\" mean?", a:"Setting `requires_grad = False` so the optimizer won't update them. Used to mathematically preserve already-learned behavior while letting other parts train."},
  {s:"Neural-network plumbing", q:"What is a gradient hook / gradient mask?", a:"A PyTorch feature that intercepts gradients flowing back through a tensor. Used here to zero out gradients on proprio columns of the first-layer weight — so even though the tensor is marked trainable, the proprio slice effectively isn't."},
  {s:"Neural-network plumbing", q:"What is backpropagation?", a:"The training loop: run network forward → compute loss → compute gradient of loss w.r.t. each weight → nudge each weight to reduce loss. Repeat."},
  {s:"Neural-network plumbing", q:"What is the learning rate?", a:"The size of each weight-update nudge during backprop. This project uses 1e-4 (0.0001) for v2–v5."},
  {s:"Neural-network plumbing", q:"What is a loss function?", a:"A single scalar measuring how badly the model is doing on a batch. The optimizer minimizes it. SAC's actor loss has task and entropy parts; v5 adds consistency; MICOA adds KL agreement and/or predictive terms."},
  {s:"Neural-network plumbing", q:"What is MSE (mean squared error)?", a:"Average of squared differences between prediction and target. The simplest loss. Used in the v5 consistency loss as `MSE(h_full, h_blind)`."},
  {s:"Neural-network plumbing", q:"What does \"MSE-style\" loss penalize?", a:"Outliers — squaring the difference makes large errors dominate. Compare to MAE (mean absolute error), which treats all errors linearly."},
  {s:"Neural-network plumbing", q:"What is KL divergence?", a:"Kullback-Leibler divergence. A number measuring how different two probability distributions P and Q are, written `KL(P || Q)`. Zero when P = Q; grows as P diverges from Q."},
  {s:"Neural-network plumbing", q:"Is KL divergence symmetric?", a:"No — `KL(P || Q) ≠ KL(Q || P)` in general. The direction expresses which distribution is the reference. `KL(P || Q)` heavily penalizes P putting mass where Q assigns near zero."},
  {s:"Neural-network plumbing", q:"What is symmetric KL?", a:"The average of both directions: `0.5 * (KL(P||Q) + KL(Q||P))`. Used when neither distribution is ground truth, so both sides are equally penalized for disagreement. Phase IX MICOA uses this."},
  {s:"Neural-network plumbing", q:"What is asymmetric (one-sided) KL?", a:"`KL(P || Q)` where one side (Q) is treated as ground truth and detached from gradients. Only P is updated. Used in Phase X/XII: vision is pulled toward proprio's future, not vice versa."},
  {s:"Neural-network plumbing", q:"What does `.detach()` do in PyTorch?", a:"Removes a tensor from the computation graph so no gradients flow back through it. Used to say \"treat this as a constant for the purposes of this loss.\""},
  {s:"Neural-network plumbing", q:"What is the Adam optimizer?", a:"A widely used gradient-descent variant that adapts the learning rate per-parameter using running averages of the gradient and its square. Default optimizer in SB3."},
  {s:"Neural-network plumbing", q:"What is over-parametrization (in this RL context)?", a:"When a network has far more weights than the task requires. The MICOA actor has ~3.2M weights for a 16-dim action space; most are unused. Helps optimization but makes interpretability harder."},

  // ── Sigma, clamps, and encoder collapse ──
  {s:"Sigma, clamps, and encoder collapse", q:"What is σ (sigma) in the encoder context?", a:"The standard deviation of the encoder's output Gaussian. Each modality (proprio, vision) outputs a distribution `N(μ, σ)` over a shared latent space Z, where σ tells the system how confident that modality is about its own prediction."},
  {s:"Sigma, clamps, and encoder collapse", q:"What does \"clamp\" mean in optimization?", a:"A hard bound enforced on a value. `clamp(x, lo, hi) = min(max(x, lo), hi)` — x cannot escape the interval [lo, hi]. Used to prevent variables from drifting into pathological ranges."},
  {s:"Sigma, clamps, and encoder collapse", q:"What is a σ-clamp (sigma clamp)?", a:"A floor enforced on σ so the encoder cannot claim infinite precision. Without a clamp σ can shrink toward zero and the modality dominates Bayesian fusion with potentially noisy content. R40 used σ_p_min = 0.135."},
  {s:"Sigma, clamps, and encoder collapse", q:"What is the \"σ-clamp floor\"?", a:"The minimum value σ is allowed to take. In R40 this floor was 0.135 (raised from R38's 0.018). Floor here = lower bound, the same meaning as \"interest rate floor\" or \"price floor.\""},
  {s:"Sigma, clamps, and encoder collapse", q:"Why does σ shrinking matter in a Product-of-Experts fusion?", a:"PoE weights each modality by its precision (1/σ²). Very small σ means very high precision, which dominates the fused posterior. If the small σ comes with degenerate content, the actor gets dominated by misinformation."},
  {s:"Sigma, clamps, and encoder collapse", q:"What is encoder collapse?", a:"When the encoder's σ drops near zero while it claims it can perfectly predict — but actually cannot. Diagnostic signature: σ near 0 AND `kl_pred` huge (the encoder is overconfident in wrong predictions). The Bayesian precision-weighting then gives it dominant influence."},
  {s:"Sigma, clamps, and encoder collapse", q:"What causes encoder collapse?", a:"Predictive-KL training pressure can drive the encoder to claim ever-higher precision (smaller σ) faster than it can actually learn to predict. If the σ-clamp floor is too low or training pressure too strong, σ collapses while content stays degenerate. Phase XII under moving balls is the example."},
  {s:"Sigma, clamps, and encoder collapse", q:"How do you diagnose encoder collapse from training logs?", a:"Look for `sigma_combined` dropping below the clamp floor (means the clamp lost the fight) and `kl_pred` exploding (R41: 638 vs. healthy 0.6–1.1). High ablation L2 in the presence of these is pathological, not productive integration."},
  {s:"Sigma, clamps, and encoder collapse", q:"What is the Goldilocks σ band?", a:"The range of σ-clamp values where the encoder is constrained enough to stay healthy but not so constrained that vision becomes inert. R40 found [0.135, 7.4] works on static balls. Phase XII showed this band is task-dependent, not universal."},
  {s:"Sigma, clamps, and encoder collapse", q:"How did Phase XII refute the \"Goldilocks σ band is universal\" hypothesis?", a:"R41 used the same clamp R40 used (σ_p_min=0.135) but trained on moving balls. σ_combined collapsed to 0.0999 (below the clamp floor) and kl_pred exploded to 638. The clamp that held on static balls did not hold on moving balls."},
  {s:"Sigma, clamps, and encoder collapse", q:"What is \"kl_pred\" / \"kl_pred_k1\"?", a:"The Phase X/XI/XII predictive KL loss value: `KL(vision(t) || proprio(t+1).detach())`. Healthy range is 0.5–2. R38 pathology was ~116. R41 catastrophe was 638."},

  // ── MICOA architecture ──
  {s:"MICOA architecture", q:"What does MICOA stand for?", a:"Multiple Inputs Confirming One Another. The architecture introduced in Phase IX to address the chronic failure of vision being non-load-bearing across 7 prior substrates."},
  {s:"MICOA architecture", q:"Why was MICOA needed?", a:"Concatenating proprio and pixels into one flat vector for SAC is \"welding two tubes end-to-end\" — SAC just follows whichever gradient is easier (proprio) and the pixel encoder gets no useful signal. MICOA adds a component whose job is to detect when two independent streams are constraining the same world-state."},
  {s:"MICOA architecture", q:"What is Product of Experts (PoE)?", a:"A Bayesian-fusion math at the core of MICOA. Each modality outputs a Gaussian over a shared latent; PoE fuses them via precision-weighted averaging. The fused σ shrinks when both agree (confirmation) and stays large when they disagree (uncertainty). Parameter-free."},
  {s:"MICOA architecture", q:"What is the PoE fusion formula for μ_combined?", a:"`μ_combined = (μ_p/σ_p² + μ_v/σ_v²) / (1/σ_p² + 1/σ_v²)` — a precision-weighted average of the two modalities' means."},
  {s:"MICOA architecture", q:"What is the PoE fusion formula for σ_combined²?", a:"`σ_combined² = 1 / (1/σ_p² + 1/σ_v²)` — the inverse of the summed precisions."},
  {s:"MICOA architecture", q:"What is the MICOAExtractor?", a:"The SB3-compatible feature extractor that implements PoE. Each modality has its own encoder (3-layer MLP for proprio, 4-conv DrQ-v2-style CNN for stereo pixels); each outputs (μ, σ); PoE fuses them. Downstream policy sees `[z_combined | μ_p | μ_v]` = 192 dims."},
  {s:"MICOA architecture", q:"What is MICOASAC?", a:"A SAC subclass that adds the MICOA agreement loss on top of SAC's normal actor/critic gradients. After SAC's normal backward pass, it does an extra forward+backward over the encoder using a separate Adam optimizer."},
  {s:"MICOA architecture", q:"What is the symmetric KL agreement loss (Phase IX)?", a:"`loss_sym = β_sym * 0.5 * (KL(p||v) + KL(v||p))` — both encoders are equally penalized for outputting different distributions about the same observation. Weighted by `--micoa-beta`."},
  {s:"MICOA architecture", q:"What is the temporal predictive KL loss (Phase X onward)?", a:"`loss_pred = β_pred * KL(N(μ_v(t), σ_v(t)) || N(μ_p(t+1), σ_p(t+1)).detach())` — vision at t is pulled toward proprio's future at t+1. Asymmetric, one-sided. Weighted by `--micoa-pred-beta`."},
  {s:"MICOA architecture", q:"Why does the predictive KL use `.detach()` on proprio's future?", a:"To make the loss one-sided. Only vision is updated by it; proprio is treated as the ground truth for what vision should predict. Mirroring proprio(t) won't satisfy this loss because in general proprio(t) ≠ proprio(t+1)."},
  {s:"MICOA architecture", q:"What is the \"corner vs tube\" framing?", a:"A flat MLP over `[proprio | pixels]` makes a longer tube. Two encoders + PoE makes a corner: σ_combined shrinks when both agree, which makes the corner rigid. The \"corner\" = constrained shared latent; the \"tube\" = an unconstrained concatenation."},
  {s:"MICOA architecture", q:"What are σ_combined and kl_agreement?", a:"MICOA's two main diagnostic scalars, logged every 500 steps. σ_combined falling = corner is forming. kl_agreement near zero = encoder distributions overlap."},
  {s:"MICOA architecture", q:"How do you read σ_combined and kl_agreement together?", a:"σ_combined falling while kl_agreement stays moderate-and-falling = healthy corner formation. σ_combined falling while kl_agreement crashes to zero in the first 4K steps = forced collapse (β too high; what R36 did)."},
  {s:"MICOA architecture", q:"What is \"confirmation without anticipation\"?", a:"Phase IX's failure mode: under symmetric KL, vision learned to mirror proprio (the cheapest way to satisfy \"agree about now\"), so vision encoded redundant info and stayed behaviorally inert."},
  {s:"MICOA architecture", q:"What is \"anticipation\" in MICOA?", a:"Phase X's intervention: vision must predict what proprio will encode one step in the future. Mirroring proprio(t) won't satisfy this — vision has to actually anticipate change, which forces it to encode information proprio doesn't yet have."},
  {s:"MICOA architecture", q:"What is the ablation delta?", a:"The L2 norm of `action(full_obs) - action(blind_obs)` — how much the policy's action changes when pixels are zeroed. The single primary metric for \"vision is load-bearing.\" Threshold: > 0.05 = passes the dead zone."},
  {s:"MICOA architecture", q:"What is the \"vision dead zone\"?", a:"The ablation delta range 0.009–0.023 that 9 vision experiments hit across Phase VII/VIII/IX. Vision is structurally present but the policy has learned to route around it."},
  {s:"MICOA architecture", q:"What is the \"active vs productive\" distinction in vision integration?", a:"A policy can be \"active\" on vision (action changes when pixels zeroed → high ablation) but \"not productive\" (outcomes don't improve). Phase X R38 and Phase XII R41 are both active-but-unproductive."},
  {s:"MICOA architecture", q:"What did Phase IX R36 reveal about MICOA's symmetric agreement loss?", a:"With β too high, kl_agreement crashed to ~0 in the first 4K steps — vision collapsed to a copy of proprio. Vision was satisfied (the easy way), so it learned nothing distinctive and stayed inert."},

  // ── Body design — what worked and what didn't ──
  {s:"Body design — what worked and what didn't", q:"Why does the body have wheels instead of legs?", a:"Bipedal walking is an entire research problem unto itself. Wheels give locomotion without the distraction of balance, leaving experiments focused on perception."},
  {s:"Body design — what worked and what didn't", q:"Why is the wheelbase wider than the chassis?", a:"So tipping onto any non-bottom face elevates the wheels and tipping is no longer mechanically stable. The \"pancake torso\" v1 body had a flatter-than-wheelbase chassis and got stuck \"on its back.\""},
  {s:"Body design — what worked and what didn't", q:"Why are the arms \"baby arms\" (short and weak)?", a:"To match a toddler's arm/body ratio. Long arms with strong gear (the prior v2 sideways arms) levered the chassis off its wheels under random action. Short + weak arms can't lever a 3.6 kg chassis."},
  {s:"Body design — what worked and what didn't", q:"Why is the head centered (y=0)?", a:"A forward-biased head (y=0.08) created a fore-aft mass asymmetry. Every trained policy then moved strictly backward (~0.34 m every seed) because pushing arms forward was mechanically easier. Centering removed this bias."},
  {s:"Body design — what worked and what didn't", q:"Why are the arms forward-pointing (+Y)?", a:"To make shoulder_roll (axis X) swing the arm in the Y-Z plane — forward, down under the body, back. This produces a paddle/rowboat stroke. Sideways arms had a useless shoulder_roll (rotation around its own axis)."},
  {s:"Body design — what worked and what didn't", q:"What is the \"any-body-to-target contact counts\" rule?", a:"A torso, hand, or wheel touching the target all count as a successful contact, not just the hands. Matches Taylor's frame (contact is contact) and fixed a bug where pinning the ball with the torso got no credit."},
  {s:"Body design — what worked and what didn't", q:"Why does the camera have only 25° FOV and single eye?", a:"One camera is the minimum \"eye\" needed to test \"learning to look.\" Binocular vision, peripheral vision, eye-saccades — all are claims about what the creature needs. Start minimal; let the environment force the rest."},
  {s:"Body design — what worked and what didn't", q:"What was the rolling-wheels fix (v8-final)?", a:"Sliding-sphere wheels with friction 0.05 produced 0.19 m in 20 s — chassis was skidding. Each wheel became a child body with a ball joint and friction was raised to 2.0. Result: 9/20 touches, mean speed 7.46 cm/s, max 21 cm/s (matches a baby crawl)."},
  {s:"Body design — what worked and what didn't", q:"What is the \"philosophical point\" about the body's joints?", a:"Every joint included is a claim about what the creature needs. The goal is to make as few claims as possible and let the environment force the rest."},

  // ── The simulation stack ──
  {s:"The simulation stack", q:"What is MuJoCo?", a:"A fast, accurate, open-source rigid-body physics simulator (owned by DeepMind). Handles arm dynamics, contacts, gravity. Standard in robot-arm RL literature."},
  {s:"The simulation stack", q:"What is Gymnasium?", a:"The standard Python interface for RL environments (`env.reset()`, `env.step(action)`, etc.). Fork of OpenAI's old `gym`. Project's envs inherit from `gym.Env`."},
  {s:"The simulation stack", q:"What is Stable-Baselines3 (SB3)?", a:"A Python library of clean, tested RL algorithm implementations (including SAC). Used here instead of writing SAC from scratch."},
  {s:"The simulation stack", q:"What is FPS in training logs?", a:"Environment steps per second — how many \"advance physics one timestep\" cycles complete per real second. Stage 1 (proprio): ~5000 FPS. Stage 2 (vision): ~200 FPS. Vision is slow because rendering pixels costs CPU/GPU."},
  {s:"The simulation stack", q:"What is proprioception (\"proprio\")?", a:"The sense of your own body's position — joint angles, joint velocities, touch bits, hip pose. Distinct from vision (camera image) and exteroception broadly. In this env: a 7- to 71-dim vector depending on configuration."},
  {s:"The simulation stack", q:"What is `hide_target_offset`?", a:"An env flag. When True, proprio drops the 3-dim fingertip-to-target vector so the agent can't cheat by reading target location from proprio. It must see it or feel it on contact."},
  {s:"The simulation stack", q:"What does \"blind proprio\" mean here?", a:"The agent has proprio but the camera is off (or there's no camera in the env). Used as a baseline to ask whether vision actually contributes anything in a follow-on stage."},
  {s:"The simulation stack", q:"What is the FlattenVisionWrapper?", a:"A tiny wrapper turning a dict observation `{proprio:[7], vision:[64,64,3]}` into a flat vector of length 7 + 12288 = 12295. Lets you use SB3's standard MlpPolicy."},
  {s:"The simulation stack", q:"What is a \"follow-on\" architecture (v2/v3/v5)?", a:"Stage 1 is trained first on proprio only, then frozen. Stage 2 (\"the follow-on\") adds vision on top — only the new pixel-input columns train. Proprio behavior is mathematically preserved (drift = 0)."},
  {s:"The simulation stack", q:"What is the consistency loss (v5)?", a:"`λ · MSE(hidden1(full_obs), hidden1(pixels_zeroed_obs))` — forces whatever vision contributes to hidden1 to stay close to what proprio alone would have produced. \"Vision must confirm, not reshape.\""},

  // ── Representation-analysis tools ──
  {s:"Representation-analysis tools", q:"What is R² (\"R-squared\")?", a:"Coefficient of determination, range [−∞, 1]. R²=1 means the regressor predicts targets perfectly. R²=0 = no better than guessing the mean. Negative = worse than guessing the mean."},
  {s:"Representation-analysis tools", q:"What is a linear probe?", a:"A simple test: freeze the model, train a linear readout to predict X from the model's hidden activations, measure R². If R² is high, the info is there and easily extractable. Low R² could mean info is absent OR tangled non-linearly."},
  {s:"Representation-analysis tools", q:"What is ridge regression?", a:"Linear regression with a small penalty on large weights to prevent overfitting. The specific linear-probe regressor used in this project (`sklearn.linear_model.Ridge`)."},
  {s:"Representation-analysis tools", q:"What is the difference between \"representation failure\" and \"policy failure\"?", a:"Two ways a channel can be active-but-useless. Representation failure = the latent never encoded the task variable (a probe can't decode it above chance) → fix the encoder. Policy failure = the latent DOES encode it (probe R² meaningful) but the policy never learned to act on it → fix the RL update. The ball-x probe found representation failure: R43's vision latent decodes ball direction at R²≈0.08 (below the proprio control), so its high ablation is binding to non-directional features, not a usable spatial code."},
  {s:"Representation-analysis tools", q:"What is CKA (Centered Kernel Alignment)?", a:"A similarity measure between two sets of activations from different networks on the same inputs. CKA=1 = essentially the same representation (up to linear reshuffling). CKA=0 = totally unrelated."},
  {s:"Representation-analysis tools", q:"Why does CKA matter for interpenetration?", a:"If v5's hidden1 has high CKA with stage1_v3's hidden1, vision is living on proprio's manifold — additive interpenetration. Low CKA = vision has carved out its own manifold and ignored proprio's."},
  {s:"Representation-analysis tools", q:"What is k-NN (k-nearest neighbors)?", a:"For each point, find its k closest neighbors (this project: k=5, Euclidean distance in hidden1 space). Used as a probe: if two observations are neighbors in hidden1, are their actions also similar?"},
  {s:"Representation-analysis tools", q:"What is neighbor-consistency ratio?", a:"`mean(action-distance among hidden1 neighbors) / mean(action-distance among random pairs)`. Lower = tighter equivalence classes. Stage1_v3 = 0.07 (14× tighter than random); v1 agents = ~0.45."},
  {s:"Representation-analysis tools", q:"What is k-means?", a:"An unsupervised clustering algorithm. Given N points and a k, finds k centers such that each observation is assigned to its nearest center. Used to carve hidden1 activations into discrete Π-classes for inspection."},
  {s:"Representation-analysis tools", q:"What is silhouette score?", a:"Cleanliness of a clustering, range [-1, 1]. High = points much closer to own cluster's center than to other centers; low = clusters bleed into each other."},
  {s:"Representation-analysis tools", q:"What is Spearman correlation?", a:"Correlation between the ranks of two variables, not raw values. Robust to outliers and to non-linear-but-monotonic relationships."},

  // ── Source theory (Taylor / interpenetration) ──
  {s:"Source theory (Taylor / interpenetration)", q:"What is set-theoretic perception theory?", a:"Taylor's framework: perception is a *response* shaped by what the world conditions, not a model the experimenter writes in. The project's grounding theory."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is \"pressure not bribery\"?", a:"A methodological rule: when you want the creature to learn behavior X, change the environment so X becomes instrumental, rather than paying reward for X directly. Pressure forces emergence; bribery just trains a habit."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is an equivalence class (in this theory)?", a:"Taylor's central construct. Many different sensory states map to the same conditioned response. \"The class IS the perception.\" Neighbor-consistency ratio is a proxy for it."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is Π (Pi) in Taylor's notation?", a:"A readiness state: the set of conditioned responses an organism is currently prepared to execute. Perception in Taylor's theory is just the simultaneous pattern of Π."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is interpenetration (Ch. 5 in Taylor)?", a:"\"Properties of the perceptual field determined by one set are incorporated in the perceptual field determined by the other set.\" Operationally: vision's representation should inherit and extend proprio's, not overwrite it."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is an unconditioned response?", a:"Reflexive, built-in (e.g., contact → grasp). The starting set of behaviors before learning."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is a conditioned response?", a:"Learned to fire from a previously-neutral cue (e.g., the *sight* of an object → grasp, after learning that seeing precedes touching)."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is critical state D in Taylor's framework?", a:"The drive state — what creates the pressure to act (e.g., contact drive in this project's task)."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is sensory surface Q?", a:"The set of receptor signals available to the organism. Vision, proprio, touch — all components of Q."},
  {s:"Source theory (Taylor / interpenetration)", q:"What is M in Taylor's framework?", a:"A motor behavior (e.g., forward-paddle). The Phase VIII hypothesis was that pure-paddle M had to fail unless modified by visual evidence."},

  // ── The phase history (chronological) ──
  {s:"The phase history (chronological)", q:"What was Phase 0 (Stage 0)?", a:"Flat floor, no fall penalty, wide targets, scaffolded. Result with blind proprio: 6/20 touches, 0 falls. Establishes baseline locomotion."},
  {s:"The phase history (chronological)", q:"What was Stage 1?", a:"2x2 m platform, fall penalty, gaze-pressure cone exclusion. Warm-started from Stage 0; peaked at 7/20 touches, 0 falls. First sign of late-training regression."},
  {s:"The phase history (chronological)", q:"What is \"late-training regression\"?", a:"Best-checkpoint and final-checkpoint differ by ~5x in touch rate. SAC over-exploits and loses the plateau. Fixes considered: entropy floor, early stopping, lower learning rate."},
  {s:"The phase history (chronological)", q:"What was the \"one-direction motion\" problem?", a:"Blind proprio has no input telling it where the ball is, so it learns one canned paddle motion and hopes the ball is in that direction. About 1/3 of placements happen to be within that cone."},
  {s:"The phase history (chronological)", q:"What was Phase I (mimo_substrate_A)?", a:"No-bribery substrate using existing CNN. Result: no motion at all. Auto-entropy collapsed the policy to zero-action."},
  {s:"The phase history (chronological)", q:"What was Phase II (mimo_dialogue_v1)?", a:"Dialogue architecture on the no-bribery substrate. Same failure family."},
  {s:"The phase history (chronological)", q:"What were Phases III / III.2?", a:"Fixed-ball-position substrates. Still hit the \"no motion at all\" failure mode."},
  {s:"The phase history (chronological)", q:"What was Phase IV (HER)?", a:"Hindsight Experience Replay + fixed balls + memory + small velocity bonus. First HER attempt; affected by a wrapper bug that zeroed the velocity bonus."},
  {s:"The phase history (chronological)", q:"What was the her_wrapper.py bug?", a:"HER relabels 4/5 of sampled transitions and runs `compute_reward` on them — those transitions saw only the sparse term, so the velocity bonus only flowed through 1/5 of gradients. Effective velocity bonus = 0 for Phases IV and V."},
  {s:"The phase history (chronological)", q:"What was Phase V / V.2?", a:"Caregiver scaffold + velocity bonus runs. V.2 was first time HER left the −2000 floor (mean reward −1899). First non-zero eval std in months."},
  {s:"The phase history (chronological)", q:"What was Phase VI / VI.2?", a:"Diagnostic: near-ball outside the goal threshold. VI.2 corrected the max-steps default (was 600, should be 2000). Showed eval std 99.5 — high per-episode variance, mixed result."},
  {s:"The phase history (chronological)", q:"What was Phase VII?", a:"Cart substrate with rolling-wheel body. Pure proprio + ent=0.5 + vel_bonus=0.10 hit +380 reward, 20/20 hits. Established the cart substrate but exposed that vision was still inert (ablation in dead zone)."},
  {s:"The phase history (chronological)", q:"What was the Phase VII vision-ablation finding?", a:"Across multiple substrates (R10, R14/15, R17/18, R26/27, R28/29), vision-ablation delta hit 0.009–0.023 — the \"dead zone.\" Vision was structurally there but the policy ignored it."},
  {s:"The phase history (chronological)", q:"What was Phase VIII?", a:"Moving balls (0.05 and 0.08 m/s) on the cart substrate. The strongest substrate-level hypothesis: balls in motion force visual learning. Result: REFUTED. Both proprio and vision broke equally; both 0–1/20."},
  {s:"The phase history (chronological)", q:"What did Phase VIII establish definitively?", a:"That substrate-level interventions cannot make vision load-bearing in this body+algorithm. Seven independent substrates returned ablation < 0.05. The next intervention had to be architectural."},
  {s:"The phase history (chronological)", q:"What was Phase IX (R36/R37)?", a:"First MICOA architecture: PoE Gaussian fusion + symmetric KL agreement loss. Worked mechanically (encoders did fuse) but vision still inert (ablation 0.002). \"Vision learned to mirror proprio.\""},
  {s:"The phase history (chronological)", q:"What was Phase X (R38)?", a:"Replaced symmetric KL with one-sided predictive KL (β_pred=0.1, β_sym=0). Broke the ablation barrier for the first time (delta=0.66, 350× R36). But vision was active not productive (6/20 either way) and task regressed (mean reward −757)."},
  {s:"The phase history (chronological)", q:"What was Phase XI R39?", a:"Multi-horizon predictive loss (t+1, t+5, t+25, t+50) + tightened σ clamp. Regressed on load-bearing. Three knobs changed at once — confounded result."},
  {s:"The phase history (chronological)", q:"What was Phase XI R40?", a:"Single-horizon t+1 + tightened σ clamp (isolating the clamp variable from R39). First run where vision was load-bearing AND task worked: ablation 0.481, 15/20 both-touched, mean reward −234."},
  {s:"The phase history (chronological)", q:"What did R40 establish?", a:"(1) The σ clamp is not what killed R39 — R40 has the same clamp and works. R39 failed because of the multi-horizon objective itself. (2) Goldilocks σ_p band: [0.135, 7.4] prevents extreme precision while still letting vision broadcast useful signal. (3) Vision can be load-bearing AND task-capable."},
  {s:"The phase history (chronological)", q:"What was Phase XII (R41/R42)?", a:"Test of R40 on the harder moving-ball task. Falsifiable claim: vision should rescue what proprio cannot. Result: REFUTED. R41 (vision) 1/20 moving, 9/20 static; R42 (proprio) 2/20 moving, 18/20 static."},
  {s:"The phase history (chronological)", q:"What was Phase XII's mechanistic surprise?", a:"R41's huge 0.85 ablation isn't healthy integration — it's encoder pathology. kl_pred ended at 638 (vs healthy 0.7); σ_combined collapsed to 0.0999 (below R40's clamp floor of 0.135). The σ-clamp band that held on static balls broke on moving balls."},

  // ── Phase XII in detail ──
  {s:"Phase XII in detail", q:"What was R41's setup?", a:"MICOA + vision, 250K steps, moving balls at 0.08 m/s, n_envs=8, --micoa-beta 0.0 --micoa-pred-beta 0.1, σ_p_min=0.135, seed 42, --checkpoint-interval 10000."},
  {s:"Phase XII in detail", q:"What was R42's setup?", a:"Matched proprio control: 250K steps, moving balls at 0.08 m/s, no MICOA, no vision, n_envs=16, otherwise identical to R41."},
  {s:"Phase XII in detail", q:"Why did Phase XII tighten the eval cadence from Phase VIII's 50K to 10K?", a:"Phase VIII's 50K cadence fired exactly one eval (at 50K), which landed in the collapse trough and missed the policy's actual peak. 10K cadence fires 25 evals, capturing the real best checkpoint."},
  {s:"Phase XII in detail", q:"What is the eval-cadence bug?", a:"When `--checkpoint-interval` is set too long, fewer evals fire and the saved `best_model.zip` may not reflect the policy's true peak (because no later eval beat the trough-landing one). Phase VIII suffered from this; Phase XII fixed it."},
  {s:"Phase XII in detail", q:"What did R41 vs R42 reveal about MICOA + moving balls?", a:"R41 underperformed R42 by 1 episode on moving balls (1 vs 2) and by 9 episodes on static-ball generalization (9 vs 18). Adding MICOA + vision actively HURT capability compared to matched proprio under the same training condition."},
  {s:"Phase XII in detail", q:"Why is the R41 vs R42 static-ball gap notable?", a:"It is the strongest counter-evidence yet to \"more vision = more behavioral capability.\" Adding MICOA under moving-ball training cost 9 episodes on static generalization. Vision is not a free addition."},
  {s:"Phase XII in detail", q:"What does Phase XII's REFUTED grade specifically mean?", a:"The Section 6 criteria required ≥4/20 both-touched moving for \"Promising\" and ≥+25% relative improvement over proprio. R41 scored 1/20 (vs R42's 2/20) — a relative loss, far from the +25% bar."},
  {s:"Phase XII in detail", q:"What's the difference between R40 and R41 in terms of encoder health?", a:"R40: kl_pred ~0.7, σ ~0.6, healthy integration. R41: kl_pred 638, σ 0.0999, degenerate integration. Same architecture, same clamp — just different training task."},
  {s:"Phase XII in detail", q:"What single metric was R41 the project record on?", a:"Vision ablation L2 delta: 0.851 (median 0.799). Highest in project history. But the metric is now understood as necessary-but-not-sufficient."},
  {s:"Phase XII in detail", q:"What new composite criterion replaces \"ablation > 0.05\"?", a:"ablation ≥ 0.20 AND kl_pred < ~5 AND σ_combined > clamp floor AND R_vision ≥ R_proprio-control on the same condition. R40 satisfies all four; R41 satisfies only the first."},

  // ── Methodological rules ──
  {s:"Methodological rules", q:"Why render a video before training >50K steps?", a:"To confirm cameras, physics, spawn position, and reward plumbing are sane. A 6-hour run that finds out at hour 2 the cameras were wrong is a bad trade. Required by alien_baby/CLAUDE.md."},
  {s:"Methodological rules", q:"Why prefer short runs + checkpoint inspection over one long run?", a:"Default follow-on length is 250K, not 1M. After 250K render from best_model.zip and decide whether to extend. CheckpointCallback saves every 50K, making mid-run renders cheap."},
  {s:"Methodological rules", q:"Why is SAC's first ~50–150K steps untrustworthy as a behavioral signal?", a:"Replay buffer is still filling, entropy is still high — even a healthy run looks like random flailing. Don't judge before ~150K steps."},
  {s:"Methodological rules", q:"What's the rule about modifying head_cam observations for display?", a:"Don't. head_cam is the *agent's* observation — smoothing/blurring it changes what the agent sees. Display post-processing belongs in the render script, not in the env."},
  {s:"Methodological rules", q:"Why isn't task success the same as \"using vision\"?", a:"The creature can solve the task by proprio-grope alone (forward paddle + hope). Eval success doesn't prove vision contributes. Use vision-ablation sensitivity (how much the action changes when pixels are zeroed) — that directly measures whether vision is load-bearing."},
  {s:"Methodological rules", q:"Why does train_v8.py play a Glass.aiff chime on completion?", a:"macOS-only audio signal so the experimenter knows to come back to the session without staring at the terminal. Don't remove. Replicate the pattern in any new training script."},
  {s:"Methodological rules", q:"Why use MPS + 16 envs on Apple Silicon?", a:"~25× warmup FPS and ~5–10× training FPS vs CPU + 8 envs. Don't revert to CPU defaults without specific reason — waiting hours for what could finish in 30 min is a bad trade."},
  {s:"Methodological rules", q:"What's the workflow agent pipeline?", a:"experiment-strategist proposes → human approves → training-engineer launches → results-analyst writes FINDINGS → theory-monitor updates THEORY_LOG."},
  {s:"Methodological rules", q:"Why does the project NOT use OBS screen-recording for conversations?", a:"It captures a static frame, not the scroll, so recordings are useless (9 MB screenshot that never changes). What works: copy-paste into a separate document."},
  {s:"Methodological rules", q:"When should a SESSION SUMMARY block be offered?", a:"At natural pause points (end of training run, end of topic, end of session). Proactively, without being asked. Format: dense, copy-paste friendly, no fancy markdown."},

  // ── Concepts the user asked to clarify ──
  {s:"Concepts the user asked to clarify", q:"What is \"gating\" in a neural network context?", a:"A learned soft switch that decides how much each input pathway contributes (or whether it contributes at all). LSTMs have forget/input/output gates. \"Gated\" generally means \"controlled by another signal.\""},
  {s:"Concepts the user asked to clarify", q:"Does \"gated\" mean \"restricted\"?", a:"Approximately yes — gating restricts or filters flow. In a neural net it's typically multiplicative: output = (gate_value) × (signal), where gate_value is between 0 and 1. Gate=0 blocks; gate=1 passes; in between attenuates."},
  {s:"Concepts the user asked to clarify", q:"What is gaze-gated reward?", a:"A reward structure where reward credit is only awarded when the agent has *visually attended* to the target before contact. The \"gate\" is the gaze: no gaze, no reward. Forces vision to become behaviorally necessary."},
  {s:"Concepts the user asked to clarify", q:"Why is gaze-gated reward listed as a Phase XIII candidate?", a:"Because all the architectural interventions (PoE, predictive KL, MICOA) still let the actor route around vision. Gaze-gating ties the reward signal itself to visual attention — vision must be used or there is no credit. It directly addresses the \"vision active but not productive\" failure."},
  {s:"Concepts the user asked to clarify", q:"Is gaze-gated reward \"bribery\" or \"pressure\"?", a:"This is open. The project's \"pressure not bribery\" rule says don't pay reward for desired behavior. A gaze gate doesn't pay for gaze — it restricts credit on other behavior unless gaze occurred. Closer to pressure (changing what's instrumental) than bribery (paying for the act)."},
  {s:"Concepts the user asked to clarify", q:"What is DrQ-v2?", a:"Data-regularized Q-learning v2 — an image-aware RL algorithm that augments visual inputs (random shifts) during Q-learning, and is known to make vision-based SAC more sample-efficient. Listed as a Phase XIII candidate."},
  {s:"Concepts the user asked to clarify", q:"What does \"image-aware RL\" mean?", a:"RL algorithms designed with vision in mind — e.g., data augmentation on pixels, contrastive visual losses, image-specific architectures. Plain SAC + CNN is NOT image-aware; it treats pixels like any other input."},
  {s:"Concepts the user asked to clarify", q:"What is the \"one-armed body\" candidate?", a:"A Phase XIII body modification where geometric reach cannot cover the entire arena from a fixed posture. Removes proprio's self-sufficient \"paddle-and-hope\" strategy and forces directional steering — which requires sensing where the ball is, i.e., vision."},

  // ── Vision load-bearing — the central question ──
  {s:"Vision load-bearing — the central question", q:"What does \"vision load-bearing\" mean operationally?", a:"When the policy's action changes meaningfully on the same state if pixel input is zeroed. Measured by the L2 norm of `action(full_obs) − action(blind_obs)`. The strict criterion is delta > 0.05."},
  {s:"Vision load-bearing — the central question", q:"What's the difference between \"vision present\" and \"vision load-bearing\"?", a:"Present = the CNN exists in the network and gradients flow through it. Load-bearing = the policy's actual outputs depend on what the camera shows. For 9 prior experiments vision was present but not load-bearing."},
  {s:"Vision load-bearing — the central question", q:"Why was vision not load-bearing across 7 substrates (R6, R10, R14/R15, R17/R18, R26/R27, R28/R29, R32-R35)?", a:"Plain SAC + concatenated proprio + pixels follows whichever gradient is easier (always proprio in this body), and the pixel encoder gets no useful training signal. Architecture, not task, was the bottleneck."},
  {s:"Vision load-bearing — the central question", q:"What's the \"ornamental CNN\" diagnosis?", a:"A CNN that exists in the network but has no behavioral influence — its gradients have been suppressed by the actor learning to rely on proprio. Visible as ablation delta < 0.025."},
  {s:"Vision load-bearing — the central question", q:"What was the 2026-05-07 breakthrough?", a:"micoa_freeze_zeroinit_cone30 best checkpoint: ablation delta 0.456, 100% of steps non-trivial. First confirmed vision-load-bearing run in the project's history (after 5+ runs with near-zero sensitivity)."},
  {s:"Vision load-bearing — the central question", q:"What did the 2026-05-07 breakthrough NOT show?", a:"That vision was steering correctly. Directional spawn test: ball fixed 15° right → 0/30 touches; ball fixed 15° left → 0/30 touches. Vision was influencing actions but had no mapping from \"ball location\" → \"correct turn.\""},
  {s:"Vision load-bearing — the central question", q:"What is \"vision affects behavior\" vs \"vision affects behavior correctly\"?", a:"Different questions. The first asks whether pixel inputs change actions (load-bearing). The second asks whether those changed actions consistently move the agent toward the target (productive). Phase XII: yes to (1), no to (2)."},

  // ── Failure modes (the taxonomy) ──
  {s:"Failure modes (the taxonomy)", q:"What is \"no motion at all\"?", a:"A failure mode from Phases I, II, III, III.2: auto-entropy collapse to a zero-action deterministic policy. The creature stops moving entirely."},
  {s:"Failure modes (the taxonomy)", q:"What is \"one move then freeze\"?", a:"A failure mode from Phases IV, V.2, VI, VI.2: the policy commits to one initial action then freezes. Not entropy collapse (ent_coef pin holds) — it's a rational SAC equilibrium under low pressure."},
  {s:"Failure modes (the taxonomy)", q:"What is \"geometric refuge\"?", a:"When the spawn distribution accidentally puts the agent within touching distance of the ball without doing anything. The policy collects free reward by sitting still. Phase V.2 had this on the inside of the goal-threshold geometry."},
  {s:"Failure modes (the taxonomy)", q:"What is the \"active but not productive\" failure?", a:"Phase X R38 and Phase XII R41. Vision is integrated into the policy (high ablation delta), but the integrated information doesn't steer behavior in a useful direction. Outcomes don't improve."},
  {s:"Failure modes (the taxonomy)", q:"What is \"pathological integration\"?", a:"When the encoder σ collapses while kl_pred explodes. The pixel pathway dominates the actor's input (high ablation) but the content is degenerate. R41 is the canonical example."},
  {s:"Failure modes (the taxonomy)", q:"What is the dependency chain failure?", a:"body → motion → encounter → memory → map. Most phases broke at link 2 (motion). Phase VII+ resolved motion via the cart substrate but the chain still broke at link 4 (memory) or link 5 (map)."},

  // ── Common reward-design concepts ──
  {s:"Common reward-design concepts", q:"What is \"reward shaping\"?", a:"Adding extra reward terms beyond the sparse goal signal to guide learning (e.g., +0.10 per cm/s of forward velocity). The project's \"pressure not bribery\" rule says shaping is bribery unless it makes a non-target behavior instrumental."},
  {s:"Common reward-design concepts", q:"What is HER (Hindsight Experience Replay)?", a:"A technique where failed transitions are relabeled with the goal \"the agent actually reached,\" not the goal originally specified. Helps with sparse rewards. The project's her_wrapper.py implements it."},
  {s:"Common reward-design concepts", q:"What is the velocity bonus?", a:"A small reward term proportional to torso speed (e.g., scale × |hip_velocity|). Used to discourage stillness. Phase VI's debate was whether it survives HER's 4/5 relabel dilution."},
  {s:"Common reward-design concepts", q:"What is the goal threshold?", a:"The distance at which a contact counts as \"reached.\" If the ball spawns inside the threshold, the agent gets free reward by doing nothing — a geometric refuge."},

  // ── Architecture flag reference ──
  {s:"Architecture flag reference", q:"What does `--micoa-beta` control?", a:"The weight on MICOA's symmetric KL agreement loss (Phase IX). 0.0 disables it. R40 uses 0.0; R36/R37 used 0.1 and 0.03."},
  {s:"Architecture flag reference", q:"What does `--micoa-pred-beta` control?", a:"The weight on MICOA's temporal predictive KL loss (Phase X+). R40 and R41 used 0.1."},
  {s:"Architecture flag reference", q:"What does `--vision` enable?", a:"Adds the stereo camera observation to the env's obs dict. Without it the policy is blind proprio."},
  {s:"Architecture flag reference", q:"What does `--memory-obs` enable?", a:"Adds memory channels (touched flags, time-since-touch, etc.) to the proprio vector. Used in Phase VII+."},
  {s:"Architecture flag reference", q:"What does `--hip-actuation` control?", a:"Whether the hip joint is actuated (controllable by the policy) or passive. `off` = hip is a free joint; agent rides the cart but doesn't drive it."},
  {s:"Architecture flag reference", q:"What does `--cart-mode constant_velocity_bouncer` mean?", a:"The cart moves at constant velocity and bounces off arena walls — locomotion is given, not learned. Vision (the bouncing balls in FOV) is now potentially load-bearing because contact requires timing."},
  {s:"Architecture flag reference", q:"What does `--ball-speed` set?", a:"The constant velocity of the bouncing balls. Phase VIII tested 0.05 and 0.08 m/s. Phase XII used 0.08."},
  {s:"Architecture flag reference", q:"What does `--curriculum-warmup` set?", a:"Number of steps before the curriculum starts ramping. In Phase XII: 2000."},
  {s:"Architecture flag reference", q:"What does `--curriculum-final-offset` set?", a:"The final difficulty (target offset distance) the curriculum locks at. In Phase XII: 0.15 m."},
  {s:"Architecture flag reference", q:"What does `--checkpoint-interval` set?", a:"How often eval fires and best_model is saved. Phase VIII used 50000 (1 eval total — too sparse). Phase XII used 10000 (25 evals — captures the actual peak)."},

  // ── Diagnostics, eval, and tooling ──
  {s:"Diagnostics, eval, and tooling", q:"What is the \"touch-counting eval\"?", a:"A standardized 20-seed deterministic eval. Each seed = one episode of up to 2000 steps. Reports: both/20, one/20, neither/20 (touched both balls, one, neither). Plus mean reward and std."},
  {s:"Diagnostics, eval, and tooling", q:"What is the \"vision ablation single-step delta\"?", a:"200 steps × 10 seeds. Compute action with full obs and again with pixels zeroed. Take L2 norm of the difference. Report mean and median. This is the primary load-bearing test."},
  {s:"Diagnostics, eval, and tooling", q:"What is the \"episode-level ablation\"?", a:"20 seeds with pixels normal, 20 seeds with pixels zeroed. Compare both-touched rates. Whereas single-step measures policy sensitivity, episode-level measures whether vision actually changes outcomes."},
  {s:"Diagnostics, eval, and tooling", q:"Why is sanity_render.py used before launches?", a:"To confirm an episode looks plausible from the starting model. Renders a full episode video showing the body, cameras, balls, contacts. Required before any >50K step run."},
  {s:"Diagnostics, eval, and tooling", q:"What is the describe_video.py tool?", a:"Sends a video file to Gemini 2.5 Flash for native video analysis. Used because Claude can't natively see video. Critical for RL where numbers can hide visually-obvious failures (e.g., creature stuck in early frame)."},
  {s:"Diagnostics, eval, and tooling", q:"Why watch a video before declaring a run successful or failed?", a:"Numeric stats can hide visually-obvious failures: agent never approaches the target, posture makes the target unreachable, agent is stuck. Numbers + video together = real assessment."},

  // ── Project file structure / "where things live" ──
  {s:"Project file structure / \"where things live\"", q:"Where do training results live?", a:"`alien_baby/results/`. Each run has a `RUN_TAG/` directory (intermediate checkpoints, vec_normalize.pkl) and a `RUN_TAG_best/` directory (best_model.zip). Training log: `RUN_TAG.log`."},
  {s:"Project file structure / \"where things live\"", q:"What is FINDINGS.md?", a:"The full experimental log. Each phase has a dated entry with what was run, the numbers, the analysis, and theory signals. Append-only history of the project."},
  {s:"Project file structure / \"where things live\"", q:"What is PROJECT_STATUS.md?", a:"A summary of \"where we stand now.\" Current best numbers, last run, what worked / didn't work. Replaced when new runs land."},
  {s:"Project file structure / \"where things live\"", q:"What is THEORY_LOG.md?", a:"Hypothesis tracking with verdicts. Each entry: hypothesis → what was tested → status (refuted / confirmed / open). The \"ruled out\" tables grow over time."},
  {s:"Project file structure / \"where things live\"", q:"What is NEXT_SESSION.md?", a:"A handoff document with the copy-paste prompt for resuming the project in a fresh terminal. Pending writeups, candidates for next experiment, known bugs."},
  {s:"Project file structure / \"where things live\"", q:"What is GLOSSARY.md?", a:"Plain-English definitions of terms in FINDINGS, the training scripts, and conversations. Source of truth for terminology."},
