  // ── Architectural choices that didn't work ──
  {s:"Architectural choices that didn't work", q:"Why didn't the pancake torso work?", a:"The torso was flatter than its wheelbase. Tipping onto an edge was a stable resting state — wheels ended up \"on its back.\""},
  {s:"Architectural choices that didn't work", q:"Why didn't sideways arms work?", a:"With 2-DOF shoulder (pitch Y + roll X), an arm aligned with X rotated around its own axis under shoulder_roll — useless. Only pitch (Y) worked, which swings up/down. The body could only push down, creating wheelies, not paddle."},
  {s:"Architectural choices that didn't work", q:"Why didn't frozen proprio from Stage 0 work in Stage 1?", a:"Stage 0's proprio was only partially adapted. Freezing it in Stage 1 (different terrain) dropped performance from 6/20 to 1/20. The protect-proprio principle presumes proprio has already learned the *target* terrain."},
  {s:"Architectural choices that didn't work", q:"Why didn't hand-only contact detection work?", a:"Episodes where the creature rolled over the ball or pinned it with the torso got no credit — a bug in the task definition, not the learner."},
  {s:"Architectural choices that didn't work", q:"Why didn't a min target radius of 0.2 m work?", a:"A resting hand was already touching the spawn point. \"14/20 touches\" was almost entirely spawn-luck, not learning."},

  // ── Bayesian fusion concepts ──
  {s:"Bayesian fusion concepts", q:"What is a Gaussian?", a:"A bell-curve probability distribution, fully specified by its mean μ (center) and standard deviation σ (spread). Written `N(μ, σ)`. The most-used distribution in ML because it has clean math (closed-form KL, easy sampling, simple precision-weighted fusion)."},
  {s:"Bayesian fusion concepts", q:"Why do MICOA encoders output Gaussians instead of point estimates?", a:"A point estimate says \"the latent is here\" with no confidence info. A Gaussian says \"I think it's here (μ), and I'm this sure (σ).\" The PoE fusion needs the σ to weight modalities by precision — without it there's no way to know whose claim should dominate."},
  {s:"Bayesian fusion concepts", q:"What is precision (in Bayesian terms)?", a:"The inverse variance: precision = 1/σ². \"How confident am I in this estimate?\" High precision = small σ = sharp claim."},
  {s:"Bayesian fusion concepts", q:"How does precision-weighted averaging work?", a:"Each input is weighted by its claimed precision. High-precision (small-σ) inputs dominate the combined estimate. Bayes-optimal when the inputs are conditionally independent."},
  {s:"Bayesian fusion concepts", q:"Why does PoE multiply distributions instead of adding?", a:"Multiplying two Gaussians gives a Gaussian whose precision is the sum of the precisions — exactly Bayesian combination of independent estimates. Adding gives a mixture, which represents disjunctive uncertainty, not joint confirmation."},
  {s:"Bayesian fusion concepts", q:"What is a posterior in Bayesian terms?", a:"The updated belief about a variable after seeing evidence: posterior = (likelihood × prior) / evidence. The PoE fused (μ_combined, σ_combined) is the posterior over the latent given both modalities."},
  {s:"Bayesian fusion concepts", q:"What is multisensory integration in Bayesian terms?", a:"Combining multiple sensory inputs about the same world state using their relative precisions. Reduces uncertainty when modalities agree; preserves uncertainty when they disagree. The brain is theorized to do this."},

  // ── Open questions for Phase XIII ──
  {s:"Open questions for Phase XIII", q:"What is the σ-clamp sweep Phase XIII proposal?", a:"Train R41-style under moving balls with progressively higher σ_p_min values (0.20, 0.30, 0.50) and see if any clamp value prevents the encoder from collapsing. Tests the \"Goldilocks band narrows with task difficulty\" hypothesis."},
  {s:"Open questions for Phase XIII", q:"What is the DrQ-v2 Phase XIII proposal?", a:"Replace plain SAC with DrQ-v2 (image-aware RL with pixel data augmentation). Tests whether the actor's gradient — not just the encoder — is the missing piece for productive vision use."},
  {s:"Open questions for Phase XIII", q:"What is the one-armed body Phase XIII proposal?", a:"A body where geometric reach cannot cover the arena from a fixed posture. Breaks proprio's \"paddle and hope\" sufficient strategy. Forces directional steering, which requires perception."},
  {s:"Open questions for Phase XIII", q:"What is the gaze-gated reward Phase XIII proposal?", a:"Reward credit only when the agent has visually attended the target before contact. Forces vision to be a prerequisite of credit, not a bonus."},
  {s:"Open questions for Phase XIII", q:"What is the broader Phase XIII framing?", a:"The substrate level is exhausted (Phase VIII closed it). The encoding level is mostly solved (R38/R40/R41 confirm ablation can be made large). What remains is the actor-gradient level: how the policy update uses the now-rich representation. Phase XIII tests different interventions at the actor level."},

  // ── Big-picture / theory ──
  {s:"Big-picture / theory", q:"What is the project's central thesis?", a:"Build a minimal embodied agent that learns to perceive the physical world through *survival consequence*, not by rewarding desired behavior. Perception emerges from environmental pressure, not from experimenter design."},
  {s:"Big-picture / theory", q:"What's the \"mechanical\" interpenetration claim?", a:"Vision should weave into proprio's pathways, not occupy a separate module. Empirically supported across R38 (0.66), R40 (0.48), R41 (0.85) ablation deltas."},
  {s:"Big-picture / theory", q:"What's the \"behavioral\" interpenetration claim?", a:"Interpenetration should produce more capable agents than modular fusion. NOT yet supported in any run in this project — R40's capability came from proprio alone; R41's incapability came from vision interfering."},
  {s:"Big-picture / theory", q:"What's the difference between mechanical and behavioral support?", a:"Mechanical = the architecture demonstrably integrates the modalities (vision-ablation L2 ≥ 0.05). Behavioral = the integrated agent outperforms a matched single-modality control. The project has the first, not the second."},
  {s:"Big-picture / theory", q:"What does \"the architecture is necessary but not sufficient\" mean?", a:"MICOA + predictive KL is required to break the ablation dead zone (no plain SAC run ever did). But achieving load-bearing vision doesn't automatically yield better outcomes. The actor still has to learn to use the now-rich signal productively."},
  {s:"Big-picture / theory", q:"What is the long-running \"vision active vs productive\" tension?", a:"Active = the policy reads pixels (high ablation). Productive = the policy reads pixels well (high outcome lift). All MICOA runs since R38 are active; none has been productive enough to beat a matched proprio control on the harder task."},
  {s:"Big-picture / theory", q:"What would count as a definitive win for the project's central thesis?", a:"A task where the matched proprio control fails (≤2/20 say) and a MICOA + vision policy succeeds (≥10/20), with healthy encoder metrics (σ > clamp floor, kl_pred < 5) and vision ablation > 0.20. That run has not yet happened."},
  {s:"Big-picture / theory", q:"Why isn't 18/20 (R42 static) enough to settle anything?", a:"Because R42 is pure proprio. It shows proprio alone is sufficient for the static-ball task — confirming what was already known. The question is whether vision adds anything, and 18/20 says it doesn't NEED to."},
  {s:"Big-picture / theory", q:"What does \"the bottleneck has moved\" mean after Phase XII?", a:"Before MICOA: the bottleneck was at the encoder (ablation in dead zone). After R40: encoder is solved, bottleneck moved to \"make integration robust across tasks.\" After R41: encoder robustness is fragile, bottleneck has moved to \"make the actor use vision productively.\" Each phase has uncovered a deeper layer."},

  // ── Generalization, robustness & recent methods (Phase XII–XV) ──
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is DroQ?", a:"Dropout Q-functions — a tweak to SAC's critics (dropout + layer-norm inside the critic, plus a higher update-to-data ratio). The regularization lets you do many gradient updates per env step without the critic diverging, so the agent learns more per sample. Introduced Phase XIV (R45), run with --droq --dropout-rate 0.01 --utd 4."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is UTD (update-to-data ratio)?", a:"How many gradient updates the agent does per environment step. Vanilla SAC is UTD=1; DroQ lets us push to UTD=4 for faster learning in samples. Only stable with regularization like DroQ."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is eccentricity (ecc) in our evals?", a:"How far off-center the target is from straight ahead, in meters of lateral offset. ecc=0.00 = ball dead ahead (easiest); larger = further to the side (harder). Standard bins: 0.00, 0.05, 0.10, 0.15, 0.20, 0.25."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"Why is the eccentricity sweep the only valid health metric on this substrate?", a:"The Phase XIV methodological finding: eval mean_reward and critic_loss are invalid here (cart motion and reward shaping make them misleading). Only the deterministic both-touched success at each ecc bin (eval_phase_v.py) reliably reflects behavior."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is vision-ablation sensitivity (abl_L2)?", a:"Zero out the pixel columns of the observation and measure how much the policy's action vector changes (L2). High = policy depends on vision; near-zero (~0.002–0.024 \"dead zone\") = vision inert. Preferred over task-success because AB can solve the task by proprio-grope alone."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"Does high vision-ablation mean vision is useful?", a:"No. R41 had the highest ablation ever (0.85) yet performed worse than the proprio control. High action-level ablation = \"load-bearing\"; actually winning more episodes than a proprio control = \"productive.\" Vision keeps clearing the first bar without the second."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is \"generalization-as-primary\"?", a:"The post-Phase-V reframing: the interesting claim isn't \"vision helps\" but that AB builds a representation that generalizes — lawful behavior on configurations it never trained on. Acid test = zero-shot transfer to held-out objects. Core confirmed for proprio; strong form (vision recruited at the margin) refuted."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is zero-shot transfer, in Phase XV terms?", a:"Performance on objects AB was never trained on, with no extra training. Phase XV trains on a subset of an equivalence class (e.g. ball radii {0.040, 0.053, 0.075}) and measures both-touched on held-out members ({0.047, 0.090})."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"Interpolation vs extrapolation for a held-out value?", a:"Interpolation = the held-out value sits inside the trained range (0.047 between 0.040 and 0.075). Extrapolation = outside it (0.090 beyond 0.075). Extrapolation is the harder, more telling test of a metric representation."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is the distance law / time-to-contact finding?", a:"Steps-to-reach scales lawfully with target distance (R44 proprio ≈ 688·d − 218, r≈0.89) and extrapolates to untrained distances — evidence the representation is metric, not memorized. Confound: the sweeping cart logs spurious ~1-step contacts that add scatter."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is the equivalence-class test (object variety)?", a:"The Phase XV paradigm: treat \"ball\" as a class with members varying along a dimension (size, shape), train on some, hold others out, and ask whether AB treats held-out members as the same class (still reaches them). Operationalizes the source theory's equivalence-class construct."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is \"the 0.075 anomaly\"?", a:"A reproducible dip in both-touched success at the TRAINED ball radius 0.075 (~6/20) in both R46 and R48, even though smaller and larger sizes do better. Anomalous because a trained size should be easy; flagged for a focused diagnostic."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is the constant_velocity_bouncer cart mode?", a:"The substrate AB sits on — a cart drifting at constant speed (--cart-speed 0.15) that bounces off the arena walls, giving gentle ongoing motion. Distinct from a static base or a self-moving ball (--ball-speed, set to 0 in Phase XIV/XV)."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is the difference between broad touch and hand-only touch in the cart env?", a:"Broad (`touched_ball*`) fires on a collision between the ball and ANY MIMo geom (feet/legs/torso/head/hands); hand-only (`hand_touched_ball*`) counts only the 8 hand/finger geoms. Reward, termination, and \"both-touched\" success use the BROAD metric — success need not involve a hand."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What did the Phase XV hand-touch diagnostic find?", a:"both_HAND = 0 across every size AND every ecc bin, on the whole cart line (R44/R45/R46/R48) — the two-ball task is never COMPLETED with two hands. But hands DO engage for one ball (any_HAND up to 21/30), rising with eccentricity where a real reach is needed. Verified not a detection bug (8 hand geoms correctly identified). Reframe: both_HAND=0 is a developmental stage, not a bug."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What is cart-sweep delivery, and why does it matter?", a:"The balls sit on the cart's sweep line, so the moving cart carries AB's BODY into the stationary ball — the substrate delivers the ball rather than AB reaching. (The cart geom itself is a non-colliding visual marker; it never pushes the ball.) It's why low-ecc success is hand-free. Not purely a confound — incidental body contact is a valid \"world-is-consistent\" signal; but to study reaching, move balls off the sweep line or score hand-only."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"What actually causes the \"0.075 anomaly\"?", a:"A glancing-blow knock-away. A mid-size ball (~0.070-0.080) is struck off-centre and skids to the arena wall, out of the no-locomotion creature's reach; the second ball can't be recovered so the episode never completes. It's a contiguous dead BAND, not a point; geometric (mass unchanged by radius); a manipulation artifact, not a generalization hole."},
  {s:"Generalization, robustness & recent methods (Phase XII–XV)", q:"Why can't you trust describe_video.py (Gemini) for pass/fail on these runs?", a:"It narrated the failing 0.075 episodes as successful \"throw-then-pickup\" sequences — it doesn't know the task is \"touch both balls\", so it over-reported success. Pass/fail must come from the metric and from frames read directly, not the free-text narration."},

  // ── Encoder / decoder and prior-work concepts ──
  {s:"Encoder / decoder and prior-work concepts", q:"In our context, what is an encoder?", a:"The part of the network that turns raw sensory input into the compact internal latent the policy reads. We have two (one per modality): the proprio encoder (3-layer MLP, 7 proprio numbers → 64-dim Gaussian (μ,σ) over the shared latent Z) and the vision encoder (DrQ-v2 4-conv CNN, stereo image → its own 64-dim (μ,σ)). \"The visual latent\" we keep probing IS the vision encoder's output. \"Representation failure\" = the encoder's output doesn't carry the needed info; the encoder is the fix target when the problem is representational."},
  {s:"Encoder / decoder and prior-work concepts", q:"In our context, what is a decoder?", a:"A readout that runs the other way — from the internal latent back to an interpretable quantity. We don't keep one as a permanent part of the agent; we attach them in two roles: (1) a PROBE (read-only diagnostic) — the ball-x linear probe is a decoder, latent → ball lateral position, R²≈0.08 measured the representation failure; (2) an AUXILIARY LOSS — a trainable decoder whose error is pushed back into the encoder to force it to encode the target. Read-only decoder measures the failure; auxiliary-loss decoder tries to fix it."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is \"modality dominance / modality competition\"?", a:"From supervised multimodal learning (Wang/Tran/Feiszli 2020; Peng OGM-GE 2022): trained jointly on two streams, the easier-to-learn stream wins the gradient and the other stays underused — a joint net can lose to the best single modality. It's the closest NAMED neighbor to AB's \"vision integrated but inert\" (proprio solves the task, so vision is starved). Difference: in that literature the weak modality is usually recoverable by rebalancing; AB's is more severe (the latent barely encodes the target — representation failure)."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is privileged teacher → student distillation?", a:"The field's standard fix for making vision load-bearing when a non-visual channel already solves the task (Learning by Cheating 2019; RMA 2021; Lee/Hwangbo 2020). Train a teacher with privileged info unavailable at deployment (e.g. the exact target vector), then train a vision-only student to imitate the teacher's actions. Vision becomes load-bearing because supervision forces it — the step AB's end-to-end run skips. The #1 recognized fix for AB's pathology."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is an asymmetric actor-critic?", a:"An RL trick (Pinto et al. 2018) where the critic gets extra privileged info (full state) during training while the actor sees only the real sensor observations. The critic is discarded at deployment, so feeding it ground-truth doesn't cheat at test time but gives the actor a better learning signal. \"Asymmetric\" = actor and critic see different things. A gentler alternative to full teacher→student distillation for putting supervisory pressure on a vision policy."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is an auxiliary (ball-position) decode loss?", a:"A second objective bolted onto the RL loss whose only job is to force the encoder to represent a specific variable. Attach a small decoder to the vision latent, train it to predict ball position, and backprop that error INTO the encoder — so the encoder is rewarded for encoding ball position regardless of whether the task gradient does. AB's #2 candidate fix; targets the encoder directly (vs the read-only probe, which only measures the failure). Success test: does vision-ablation become directional (which side the ball is on) instead of the content-free ecc=0 spike?"},
  {s:"Encoder / decoder and prior-work concepts", q:"Is generalization just \"many variations resolving to the same outcome\"? (domain randomization vs equivalence class)", a:"That's the mechanism (called domain randomization in robotics RL, and the equivalence class in the source theory: many instances -> one conditioned response). But variation is NECESSARY, not SUFFICIENT. Proof from our own runs: proprio saw the variations and built a lawful, extrapolating class (the distance law); vision saw the SAME variations and still failed (R^2~=0.08) because nothing forced its latent to encode what varied. Variation only generalizes when the learner is compelled to REPRESENT it. Also note: in RL the \"same outcome\" is defined by the reward function, standing in for the body's unconditioned reflex in development."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is the \"coordination vs interpenetration\" distinction (Numenta vs Taylor/MICOA)?", a:"COORDINATION (Numenta voting): each cortical column builds its own object model independently; modules exchange messages and reach consensus, but no module's internal representation is restructured by another's learning history -- experts vote, the vote doesn't rewire any expert. INTERPENETRATION (Taylor Ch.5, what MICOA builds): the modules' representations become mutually constitutive -- vision comes to encode the world the way proprio does because proprio's history reshapes vision. The disagreement is NOT about whether a domain-general mechanism exists (Numenta grants one: reference frames everywhere) -- it's about content-merger. Prism adaptation is the discriminating test."},
  {s:"Encoder / decoder and prior-work concepts", q:"How does prism adaptation discriminate coordination from interpenetration?", a:"If vision only COORDINATED with proprio via voting, reversing prisms would produce permanent vision-vs-proprio disagreement (vision votes \"left\", proprio \"right\", forever). Instead, over days of active movement, vision RECALIBRATES onto the motor frame -- its internal mapping is restructured by the other modality's learning history. That restructuring is interpenetration; pure coordination cannot produce it."},
  {s:"Encoder / decoder and prior-work concepts", q:"What does the prism-adaptation literature establish for AB's proprio-first thesis?", a:"Two facts. (1) Adaptation requires ACTIVE, self-produced movement -- Held & Hein's 1963 kitten carousel: the passively-carried kitten gets identical visual input and does NOT adapt; exposure isn't enough, action is necessary (the passive kitten = a pure confirmation loss). (2) The motor/world frame is the ANCHOR: when vision and action conflict the system re-anchors vision toward action, not vice versa (\"reality and movement don't switch; vision does\"). Justifies the .detach()-on-proprio asymmetry in MICOA's temporal-predictive loss."},
  {s:"Encoder / decoder and prior-work concepts", q:"Does Numenta's \"replication beats centralization\" argument rule out AB's shared generalization mechanism?", a:"No. That argument is against a BASE COLUMN (one privileged module others query) -- which AB doesn't propose. AB proposes a base MECHANISM (a domain-general way of building generalization every column instantiates) -- and Numenta already believes in one (reference frames used everywhere). They agree on mechanism-generality; they disagree only on content-merger (interpenetration). Refinement AB holds honestly: a general mechanism doesn't guarantee automatic success -- AB's vision stayed inert (R^2~=0.08) despite seeing all the variation."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is the \"movement-as-substrate\" thesis, and what's the open bet in it?", a:"A step beyond generalization-as-primary: movement isn't just learned first, it's the SUBSTRATE the generalizing representation is built on. Confirmed for proprio (the extrapolating distance law; prism adaptation showing the motor frame is the anchor). The OPEN, not-yet-confirmed bet: that building in richer movement makes VISION generalize too. R49 and DOF-curriculum runs are the cheap probes of that causal link -- to be confirmed on the current body BEFORE any expensive port to a richer simulator."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is the rule \"faithful to the mechanism, free on the implementation\"?", a:"AB reconstructs human perception but isn't bound to the human developmental path. Judge each human fact by whether it's LOAD-BEARING for the mechanism (active self-produced movement; motor competence before vision is trusted; graded freezing/freeing of DOF -- keep) or an INCIDENTAL detail of being a mammal (gestation, helpless emergence, the literal year of crawling -- drop or compress into a curriculum). Diverge freely where it SERVES the mechanism (privileged training signals, near-perfect proprioception, repeatable resets, compressed lifetimes); stay faithful only to movement-first, interpenetration, and the equivalence class."},
  {s:"Encoder / decoder and prior-work concepts", q:"What are the two concrete levers for building movement in as a substrate, and their cost?", a:"(1) Graded DOF freezing/freeing (Berthouze & Lungarella) -- lock most joints, master the reduced body, progressively release DOF so each motor competence scaffolds the next; CHEAP, a curriculum change in MuJoCo today. (2) Migrate to a richer/growing body (MIMo v2: hands, foveated vision, sensorimotor delays, birth->24mo growth) -- EXPENSIVE, justified only once the substrate->vision-generalization link is confirmed on the current simplified body."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is the \"winnability\" rule (every episode must be winnable)?", a:"The project's governing design rule (2026-06-16): we must give AB the tools to succeed; if AB never gets near the target, that's OUR setup failure, not AB's learning failure, and it teaches nothing. Every episode must be winnable -- the action we want reinforced (touching the ball) must be physically possible for AB's body, and for vision runs the target must be in view or bringable into view by an action AB can execute (a head turn). Never present a target that can't be seen and can't be found. Don't score impossible configs as \"AB failed.\" Body fidelity never outranks winnability. Rationale: an action can only be reinforced if it can occur."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is a \"constrained action space\" (position-offset control) and why does it matter for AB?", a:"From \"A Walk in the Park\" (2022): the policy outputs small OFFSETS around a default pose (turned into motion by a PD position controller with damping Kd~10), instead of raw joint torques. Their ablation: a raw-torque (\"unconstrained\") action space makes ZERO progress; position-offset control trains stably (a quadruped walks in ~20 min). AB's mimo_crawler.xml uses 26 raw-torque <motor> actuators and 0 position servos -- exactly the failing config -- which is the leading verified-precondition hypothesis for why AB's locomotion collapsed (stillness / one-move-then-freeze). Fix = small additive XML/wrapper change, not new research."},
  {s:"Encoder / decoder and prior-work concepts", q:"What is a reverse / start-state curriculum?", a:"The principled way to enforce the winnability rule (Florensa 2017/2018): start every episode with the goal trivially achievable (target close, in reach, in view) and push start-states/goals outward only as success rate rises, so the agent always has a winnable episode and difficulty tracks competence. Replaces AB's hand-tuned spawn-cone/eccentricity scaffolds with a mechanism that never presents an impossible config. Pairs with automatic goal generation (goals of intermediate, feasible-but-not-mastered difficulty)."},
];

    ],
  },
  "Linear layer": {
    aka: ["linear layer"],
    levels: [

    levels: [

    levels: [
      "The part of the network that turns raw sensory input into the compact internal latent the policy actually reads.",

    levels: [

  },
  "latent space": {
    aka: ["latent", "the latent"],
    levels: [

    levels: [

    ],
  },
  "backpropagation": {
    aka: ["backprop", "gradient descent"],
    levels: [
      "The training loop: run the network forward, compute a loss, compute the gradient of the loss w.r.t. each weight, nudge each weight to reduce the loss, repeat.",

    ],
  },
  "learning rate": {
    levels: [
      "The size of each weight-update nudge during backprop.",

  },
  "loss function": {
    aka: ["loss"],
    levels: [
      "A single scalar measuring how badly the model is doing on a batch; the optimizer minimizes it.",
      "SAC's actor loss has task and entropy parts; v5 adds a consistency term; MICOA adds KL agreement and/or predictive terms.",
    ],
  },
  "MSE": {
    aka: ["mean squared error"],
    levels: [
      "Mean squared error — the average of squared differences between prediction and target.",
      "Written $\\frac{1}{n}\\sum (\\hat{y} - y)^2$. The simplest loss; squaring makes large errors dominate. Our v5 consistency loss is $\\text{MSE}(h_\\text{full}, h_\\text{blind})$.",
    ],
  },
  "L2 norm": {
    aka: ["L2", "ablation L2", "abl_L2"],
    levels: [

      "We use it for the ablation delta: the size of the change in the action vector when pixels are zeroed.",
      "For a vector $v = (v_1, \\dots, v_n)$ the L2 norm is $\\lVert v \\rVert_2 = \\sqrt{\\sum_{i=1}^{n} v_i^2}$. The ablation delta is $\\lVert a_\\text{full} - a_\\text{blind} \\rVert_2$.",
    ],
  },
  "KL divergence": {
    aka: ["KL", "Kullback-Leibler", "Kullback-Leibler divergence"],
    levels: [
      "A number measuring how different two probability distributions $P$ and $Q$ are.",
      "Written $\\mathrm{KL}(P \\,\\Vert\\, Q)$. Zero when $P = Q$; grows as $P$ diverges from $Q$. For two Gaussians it has a clean closed form, so it's cheap and differentiable — usable directly as a loss term.",
      "Crucially asymmetric: $\\mathrm{KL}(P \\Vert Q) \\neq \\mathrm{KL}(Q \\Vert P)$ in general. When neither side is ground truth you average both directions (symmetric KL); when one is the reference you write it in that direction and detach the reference.",
    ],
  },
  "R²": {
    aka: ["R-squared", "R^2"],
    levels: [

    ],
  },
  "linear probe": {
    aka: ["probe"],
    levels: [
      "A simple trick for asking \"does this internal representation contain information X?\"",
      "Freeze the main model, train a linear readout (one matrix multiply) to predict X from its hidden activations, and measure how well it works. High $R^2$ = the info is there and easily extractable; low $R^2$ could mean absent — or just tangled non-linearly.",
    ],
  },
  "CKA": {
    aka: ["Centered Kernel Alignment"],
    levels: [

      "$\\mathrm{CKA} = 1$ means the two networks represent the input essentially the same way; 0 means unrelated. We use linear CKA: $\\frac{\\lVert X^\\top Y \\rVert^2}{\\lVert X^\\top X \\rVert \\cdot \\lVert Y^\\top Y \\rVert}$. High CKA between v5's hidden1 and stage1's = vision living on proprio's manifold (additive interpenetration).",
    ],
  },
  "representation failure": {
    aka: ["representation failure vs policy failure", "policy failure"],
    levels: [
      "When the visual latent never encoded the task-relevant variable in the first place — a probe reading the latent can't decode it above chance.",
      "Contrast with policy failure: the latent DOES encode the variable (probe is meaningful) but the policy gradient never learned to act on it. Representation failure → fix the encoder; policy failure → fix the RL update.",

    ],
  },
  "MICOA": {
    aka: ["Multiple Inputs Confirming One Another"],
    levels: [
      "Multiple Inputs Confirming One Another — the architecture we built in Phase IX/X to fix vision never being load-bearing.",
      "The diagnosis was structural: concatenating proprio and pixels into one flat vector is \"welding two tubes end-to-end.\" SAC follows whichever gradient is easier (always proprio) and the pixel encoder gets no signal. MICOA adds a component whose job is to detect when two independent streams are constraining the same world-state.",
    ],
  },
  "Product of Experts": {
    aka: ["PoE"],
    levels: [
      "The parameter-free Bayesian-fusion math at the heart of MICOA.",
      "Each modality's encoder outputs a Gaussian $(\\mu, \\sigma)$ over the shared latent; PoE fuses them by precision-weighted averaging. The fused $\\sigma$ shrinks when both agree (confirmation) and stays large when they disagree (uncertainty).",
      "$\\mu_\\text{comb} = \\dfrac{\\mu_p/\\sigma_p^2 + \\mu_v/\\sigma_v^2}{1/\\sigma_p^2 + 1/\\sigma_v^2}, \\quad \\sigma_\\text{comb}^2 = \\dfrac{1}{1/\\sigma_p^2 + 1/\\sigma_v^2}$. No learned weights; confirmation emerges from multiplying independent Gaussians.",
    ],
  },
  "interpenetration": {
    levels: [
      "From the source theory (Ch. 5): \"properties of the perceptual field determined by one set are incorporated in the perceptual field determined by the other set.\"",
      "Our operational reading: vision's representation should inherit and extend proprio's, not overwrite it. v5's consistency loss is an explicit test. Contrast with coordination (Numenta's voting), where experts vote but no expert's internal representation is restructured by another's learning.",
    ],
  },
  "vision-ablation sensitivity": {
    aka: ["vision ablation", "ablation delta", "ablation", "vision-ablation"],
    levels: [
      "Our primary measure of \"does vision matter to behavior?\": zero out the pixel columns and measure how much the policy's action changes.",
      "Measured as the L2 norm of $a_\\text{full} - a_\\text{blind}$. High = the policy depends on vision; near-zero = inert (\"dead zone\" ≈ 0.002–0.024). Preferred over task-success because AB can solve the task by proprio-grope alone.",
      "Caveat learned across phases: high action-level ablation does NOT imply vision is useful. R41 had the highest ablation ever (0.85) yet performed worse than the proprio control — load-bearing is not the same bar as productive.",
    ],
  },
  "load-bearing": {
    aka: ["load bearing", "load-bearing vs productive", "productive"],
    levels: [
      "Two different bars for vision.",
      "Load-bearing (action-level): zeroing pixels changes the action (ablation > threshold). Productive (outcome-level): having vision actually makes AB succeed more than a matched proprio-only control. The project's recurring finding: vision keeps clearing the first bar without clearing the second.",
    ],
  },
  "eccentricity": {
    aka: ["ecc"],
    levels: [
      "How far off-center the target is from AB straight ahead, in meters of lateral offset.",
      "ecc=0.00 = ball dead ahead (easiest); larger ecc = further to the side (harder). Standard bins: 0.00, 0.05, 0.10, 0.15, 0.20, 0.25. The eccentricity sweep scores both-touched success at each bin.",
    ],
  },
  "DroQ": {
    aka: ["Dropout Q-functions"],
    levels: [
      "A tweak to SAC's critics: add dropout + layer-norm inside the critic networks and raise the update-to-data ratio.",
      "The regularization lets you do many gradient updates per environment step without the critic overfitting/diverging, so the agent learns more per unit of experience. Introduced in Phase XIV (R45); run with --droq --dropout-rate 0.01 --utd 4.",
    ],
  },
  "UTD": {
    aka: ["update-to-data ratio", "update-to-data"],
    levels: [
      "Update-to-data ratio — how many gradient updates the agent does per environment step.",
      "Vanilla SAC is UTD=1; DroQ lets us push it higher (we use UTD=4) for more learning per sample. Higher UTD = more compute per step but faster learning in samples — only stable with regularization like DroQ.",
    ],
  },
  "encoder collapse": {
    levels: [
      "When the encoder's $\\sigma$ drops near zero while it claims it can perfectly predict — but actually cannot.",
      "Diagnostic signature: $\\sigma$ near 0 AND kl_pred huge (the encoder is overconfident in wrong predictions). The Bayesian precision-weighting then gives it dominant influence. Phase XII under moving balls is the example (R41: kl_pred = 638).",
    ],
  },
  "σ-clamp": {
    aka: ["sigma clamp", "sigma-clamp", "σ clamp", "Goldilocks σ band", "Goldilocks band"],
    levels: [
      "A floor enforced on $\\sigma$ so the encoder cannot claim infinite precision.",
      "Without a clamp $\\sigma$ can shrink toward zero and the modality dominates the Bayesian fusion with potentially noisy content. R40 used $\\sigma_{p,\\min} = 0.135$. The \"Goldilocks band\" is the range where the encoder is constrained enough to stay healthy but not so much that vision goes inert — and Phase XII showed it's task-dependent, not universal.",
    ],
  },
  "MuJoCo": {
    levels: [
      "A fast, accurate, open-source rigid-body physics simulator (owned by DeepMind).",
      "Handles the arm, the objects, contact forces, and gravity. Standard in robot-arm RL literature.",
    ],
  },
  "proprioception": {
    aka: ["proprio", "proprioceptive"],
    levels: [
      "The sense of your own body's position — joint angles, joint velocities, touch bits, hip pose.",
      "Distinct from vision (the camera image) and exteroception more broadly. In our env: a 7- to 71-dim vector depending on configuration.",
    ],
  },
  "Stable-Baselines3": {
    aka: ["SB3", "Stable Baselines3"],
    levels: [
      "A Python library of clean, tested RL algorithm implementations (including SAC).",
      "We use it instead of writing SAC from scratch. Our envs plug into it via Gymnasium.",
    ],
  },
  "Gymnasium": {
    aka: ["gym"],
    levels: [
      "The standard Python interface for RL environments (env.reset(), env.step(action), etc.).",
      "Fork of OpenAI's old gym. Our TabletopReachEnv inherits from gym.Env.",
    ],
  },
  "FPS": {
    levels: [
      "Environment steps per second — how many simulate-one-timestep-and-get-a-result cycles complete per real second.",
      "NOT video frames — nobody is watching; it's the speed of the training loop. Stage 1 (proprio only) ran at ~5000 FPS; Stage 2 (with vision) runs at ~200 FPS because rendering pixels costs CPU time.",
    ],
  },
  "σ": {
    aka: ["sigma"],
    levels: [
      "The standard deviation of an encoder's output Gaussian — how confident that modality is about its own prediction.",
      "Each modality outputs a distribution $\\mathcal{N}(\\mu, \\sigma)$ over the shared latent $Z$. In PoE the precision $1/\\sigma^2$ is the weight, so a smaller $\\sigma$ means more influence over the fused result.",
    ],
  },
  "generalization-as-primary": {
    aka: ["generalization as primary"],
    levels: [
      "Our reframing of the project's thesis after Phase XIII: the interesting claim is not \"vision helps\" but that AB builds a representation that generalizes.",
      "Lawful behavior on object/target configurations it was never trained on. The acid test is zero-shot transfer to held-out objects, not raw task success. Confirmed (core) for proprio; the strong form (vision recruited at the margin) was refuted.",
    ],
  },
  "winnability": {
    aka: ["winnable", "every-episode-must-be-winnable"],
    levels: [
      "The project's governing design rule (2026-06-16): we must give AB the tools to succeed.",
      "Every episode must be winnable — the action we want reinforced (touching the ball) must be physically possible for AB's body, and for vision runs the target must be in view or bringable into view. If AB never gets near the target, that's OUR setup failure, not AB's learning failure, and it teaches nothing. Never score impossible configs as \"AB failed.\"",
    ],
  },
  "zero-shot transfer": {
    aka: ["zero-shot", "zero shot transfer"],
    levels: [
      "Performance on objects/conditions AB was never trained on, with no extra training.",
      "Phase XV's central test: train on a subset of an equivalence class (e.g. ball radii {0.040, 0.053, 0.075}) and measure both-touched on held-out members ({0.047, 0.090}).",
    ],
  },
  "domain randomization": {
    levels: [
      "The robotics-RL name for the mechanism that builds an equivalence class.",
      "Train across many variations (object size, position, lighting, dynamics) that all earn reward for the SAME outcome, and the breadth you trained on becomes the breadth you generalize to. The engineering version of \"many instances → one conditioned response → the class IS the perception.\" Caveat: variation is necessary but not sufficient — vision saw the same variations as proprio and still failed ($R^2 \\approx 0.08$).",
    ],
  },
  "equivalence class": {
    levels: [
      "The source theory's central construct: many different sensory states that map to the same conditioned response.",
      "\"The class IS the perception.\" Our neighbor-consistency ratio is a proxy for class structure. The Phase XV paradigm treats \"ball\" as a class with members varying along a dimension, trains on some, and holds others out.",
    ],
  },
  "auxiliary decode loss": {
    aka: ["auxiliary ball-position decode loss", "auxiliary decode"],
    levels: [
      "A second training objective bolted onto the RL loss whose only job is to force the encoder to represent a specific variable.",
      "Attach a small decoder to the vision latent, train it to predict the target's position, and backprop that error INTO the encoder — so the encoder is rewarded for putting target position into the latent regardless of whether the RL gradient bothers to. Our #2 candidate fix for representation failure (R49 result: refuted — the loss mostly captured distance).",
    ],
  },
};

// ── KaTeX + rich text helpers ─────────────────────────────────────────────────
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Build a longest-match-first lookup table from GLOSSARY (term + aka aliases).
function buildTermIndex() {
  const entries = [];
  for (const term of Object.keys(GLOSSARY)) {
    entries.push([term, term]);
    for (const alias of (GLOSSARY[term].aka || [])) entries.push([alias, term]);
  }
  // Longest alias first so "L2 norm" wins over "L2".
  entries.sort((a, b) => b[0].length - a[0].length);
  return entries;
}
const TERM_INDEX = buildTermIndex();

// linkify(text): wrap any glossary term/alias in a tappable <span class="term">.
// Rules: longest-match wins; HTML escaped; anything inside $...$ math is skipped
// (left as a raw $...$ token for KaTeX to render later). Returns HTML string.
function linkify(text) {
  // Split into math ($...$) and non-math segments. Math is passed through verbatim.
  const parts = text.split(/(\$[^$]*\$)/g);
  return parts.map(seg => {
    if (seg.startsWith('$') && seg.endsWith('$') && seg.length >= 2) {
      return seg; // math placeholder — do not linkify, rendered by typesetMath
    }
    return linkifySegment(seg);
  }).join('');
}

function linkifySegment(seg) {
  let out = '';
  let i = 0;
  const isWord = c => /[A-Za-z0-9]/.test(c);
  while (i < seg.length) {
    let matched = null;
    for (const [alias, term] of TERM_INDEX) {
      const cand = seg.substr(i, alias.length);
      if (cand.toLowerCase() !== alias.toLowerCase()) continue;
      // Word-boundary check so "step" doesn't match inside "timestep".
      // Only enforced when the alias edges are alphanumeric.
      const before = i > 0 ? seg[i - 1] : '';
      const after = seg[i + alias.length] || '';
      if (isWord(alias[0]) && before && isWord(before)) continue;
      if (isWord(alias[alias.length - 1]) && after && isWord(after)) continue;
      matched = { alias, term, len: alias.length };
      break;
    }
    if (matched) {
      const shown = seg.substr(i, matched.len);
      out += '<span class="term" data-term="' + escapeHtml(matched.term) + '">'
           + escapeHtml(shown) + '</span>';
      i += matched.len;
    } else {
      out += escapeHtml(seg[i]);
      i++;
    }
  }
  return out;
}

// typesetMath(el): replace $...$ tokens in an element's text nodes with KaTeX.
// Safe if KaTeX hasn't loaded yet (leaves the $...$ visible).
function typesetMath(el) {
  if (typeof katex === 'undefined') return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const targets = [];
  let n;
  while ((n = walker.nextNode())) {
    if (n.nodeValue.indexOf('$') !== -1) targets.push(n);
  }
  for (const node of targets) {
    const frag = document.createDocumentFragment();
    const segs = node.nodeValue.split(/(\$[^$]*\$)/g);
    for (const s of segs) {
      if (s.startsWith('$') && s.endsWith('$') && s.length >= 2) {
        const span = document.createElement('span');
        try { katex.render(s.slice(1, -1), span, { throwOnError: false }); }
        catch (e) { span.textContent = s; }
        frag.appendChild(span);
      } else if (s) {
        frag.appendChild(document.createTextNode(s));
      }
    }
    node.parentNode.replaceChild(frag, node);
  }
}

// setRichText(el, text): linkify + render math + wire up term taps.
function setRichText(el, text) {
  el.innerHTML = linkify(text);
  el.querySelectorAll('.term').forEach(span => {
    span.addEventListener('click', ev => {
      ev.stopPropagation(); // open the drill sheet WITHOUT flipping the card
      openTerm(span.dataset.term);
    });
  });
  typesetMath(el);
}

// ── Drill-down logic ──────────────────────────────────────────────────────────
const DRILL_MAX_DEPTH = 8;     // cap breadcrumb stack so it can't grow forever
// Each stack frame: { term, level }. level = how many panels deep within the term.
let drillStack = [];

function openTerm(term) {
  if (!GLOSSARY[term]) return; // unknown-term safety: do nothing
  if (drillStack.length >= DRILL_MAX_DEPTH) return;
  drillStack.push({ term, level: 0 });
  document.getElementById('drill-backdrop').classList.remove('hidden');
  renderDrill();
}
function deeper() {
  const top = drillStack[drillStack.length - 1];
  if (!top) return;
  const levels = GLOSSARY[top.term].levels;
  if (top.level < levels.length - 1) { top.level++; renderDrill(); }
}
function drillBack() {
  if (drillStack.length <= 1) { closeDrill(); return; }
  drillStack.pop();
  renderDrill();
}
function closeDrill(ev) {
  if (ev && ev.target && ev.target.id !== 'drill-backdrop') return; // ignore inner clicks
  drillStack = [];
  document.getElementById('drill-backdrop').classList.add('hidden');
}
function renderDrill() {
  const top = drillStack[drillStack.length - 1];
  if (!top) return;
  const entry = GLOSSARY[top.term];
  const levels = entry.levels;

  // Breadcrumb: the chain of terms drilled through, e.g. "vision ablation › L2 norm".
  const crumbEl = document.getElementById('drill-breadcrumb');
  crumbEl.innerHTML = drillStack
    .map(f => escapeHtml(f.term))
    .join('<span class="crumb-sep">›</span>');

  document.getElementById('drill-title').textContent = top.term;
  document.getElementById('drill-level-label').textContent =
    'Level ' + (top.level + 1) + ' of ' + levels.length;

  // Body: linkified so terms inside a definition are themselves tappable,
  // pushing a new frame onto the breadcrumb stack.
  setRichText(document.getElementById('drill-body'), levels[top.level]);

  // Controls.
  const deeperBtn = document.getElementById('drill-deeper');
  const hasDeeper = top.level < levels.length - 1;
  deeperBtn.classList.toggle('hidden', !hasDeeper);
  // Back pops a breadcrumb frame; at the root it dismisses the sheet.
  document.getElementById('drill-back').textContent =
    drillStack.length > 1 ? '← Back' : '← Close';
}

// ── State ────────────────────────────────────────────────────────────────────
// User-added cards persist in this browser via localStorage.
const STORE_KEY = 'alienbaby_user_cards';
function loadUserCards() {
  try { const v = JSON.parse(localStorage.getItem(STORE_KEY)); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function saveUserCards() { localStorage.setItem(STORE_KEY, JSON.stringify(userCards)); }

let userCards = loadUserCards();
let CARDS = ALL_CARDS.concat(userCards);
let ALL_SECTIONS = [...new Set(CARDS.map(c => c.s))];
let activeSections = new Set(ALL_SECTIONS);
let deck = [], wrongPile = [], correctCount = 0, totalShown = 0, flipped = false, current = null;

function rebuildData() {
  CARDS = ALL_CARDS.concat(userCards);
  ALL_SECTIONS = [...new Set(CARDS.map(c => c.s))];
  buildFilterPanel();
  updateExportBtn();
}

// ── Filter panel ─────────────────────────────────────────────────────────────
function buildFilterPanel() {
  const wrap = document.getElementById('filter-btns');
  wrap.innerHTML = '';
  ALL_SECTIONS.forEach(s => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (activeSections.has(s) ? ' active' : '');
    b.textContent = s;
    b.dataset.s = s;
    b.onclick = () => {
      // Tap a section = study only that section, immediately.
      activeSections = new Set([s]);
      document.querySelectorAll('.filter-btn').forEach(x => x.classList.toggle('active', x.dataset.s === s));
      applyFilter();
    };
    wrap.appendChild(b);
  });
}
function selectAll() {
  activeSections = new Set(ALL_SECTIONS);
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.add('active'));
}
function selectNone() {
  activeSections.clear();
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
}
function applyFilter() {
  if (activeSections.size === 0) { alert('Select at least one section.'); return; }
  toggleFilterPanel(true);
  correctCount = 0; totalShown = 0;
  const filtered = CARDS.filter(c => activeSections.has(c.s));
  startRound(filtered);
}
function toggleFilterPanel(forceClose) {
  const p = document.getElementById('filter-panel');
  const hidden = p.classList.toggle('hidden');
  if (forceClose) p.classList.add('hidden');
  document.getElementById('filter-toggle').textContent = 'Filter sections ' + (p.classList.contains('hidden') ? '▾' : '▴');
}

// ── Core deck logic ───────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function startRound(cards) {
  deck = shuffle([...cards]);
  wrongPile = [];
  document.getElementById('study-view').style.display = 'flex';
  document.getElementById('done-view').classList.add('hidden');
  showNext();
}
function showNext() {
  if (deck.length === 0) { showDone(); return; }
  current = deck[deck.length - 1];
  flipped = false;
  document.getElementById('card-inner').classList.remove('flipped');
  setRichText(document.getElementById('q-text'), current.q);
  setRichText(document.getElementById('a-text'), current.a);
  document.getElementById('card-section').textContent = current.s;
  document.getElementById('card-section-back').textContent = current.s;
  document.getElementById('actions').classList.add('hidden');
  document.getElementById('followup-row').classList.add('hidden');
  document.getElementById('flip-btn-row').classList.remove('hidden');
  updateStats();
}
// Free flip: toggle front<->back any number of times. The card decision
// (right/wrong) is made ONLY via the ✗/✓ buttons, never by flipping.
function flip() {
  flipped = !flipped;
  const inner = document.getElementById('card-inner');
  inner.classList.toggle('flipped', flipped);
  // The flip button lives on the front; ✗/✓ + follow-up live on the back.
  document.getElementById('actions').classList.toggle('hidden', !flipped);
  document.getElementById('followup-row').classList.toggle('hidden', !flipped);
  document.getElementById('flip-btn-row').classList.toggle('hidden', flipped);
}
function mark(correct) {
  deck.pop();
  if (correct) correctCount++;
  else wrongPile.push(current);
  totalShown++;
  showNext();
}
function updateStats() {
  document.getElementById('s-remaining').textContent = deck.length;
  document.getElementById('s-correct').textContent = correctCount;
  document.getElementById('s-wrong').textContent = wrongPile.length;
  const total = deck.length + totalShown;
  document.getElementById('progress').style.width = Math.round((totalShown / Math.max(total, 1)) * 100) + '%';
  document.getElementById('counter').textContent = `Card ${totalShown + 1} of ${total}`;
}
function showDone() {
  document.getElementById('study-view').style.display = 'none';
  document.getElementById('done-view').classList.remove('hidden');
  if (wrongPile.length === 0) {
    document.getElementById('done-icon').textContent = '🎉';
    document.getElementById('done-title').textContent = 'Perfect round!';
    document.getElementById('done-msg').textContent = 'You got every card right. Resetting the full active deck for another pass.';
  } else {
    document.getElementById('done-icon').textContent = '🔁';
    document.getElementById('done-title').textContent = wrongPile.length + ' card' + (wrongPile.length > 1 ? 's' : '') + ' to review';
    document.getElementById('done-msg').textContent = `${correctCount} correct this round. Next round will focus on the ${wrongPile.length} you missed.`;
  }
}
function restart() {
  const nextDeck = wrongPile.length > 0 ? wrongPile : CARDS.filter(c => activeSections.has(c.s));
  correctCount = 0; totalShown = 0;
  startRound(nextDeck);
}

// ── Add cards on the fly ──────────────────────────────────────────────────────
const NEW_SECTION = '➕ New section…';
function openAddModal(prefillSection) {
  const sel = document.getElementById('add-section');
  sel.innerHTML = '';
  ALL_SECTIONS.concat(NEW_SECTION).forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
  sel.value = (prefillSection && ALL_SECTIONS.includes(prefillSection)) ? prefillSection : ALL_SECTIONS[0];
  onSectionChange();
  document.getElementById('add-q').value = '';
  document.getElementById('add-a').value = '';
  document.getElementById('add-new-section').value = '';
  document.getElementById('add-modal').classList.remove('hidden');
  document.getElementById('add-q').focus();
}
function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }
function onSectionChange() {
  const isNew = document.getElementById('add-section').value === NEW_SECTION;
  document.getElementById('new-section-field').classList.toggle('hidden', !isNew);
}
function saveNewCard() {
  let section = document.getElementById('add-section').value;
  if (section === NEW_SECTION) section = document.getElementById('add-new-section').value.trim();
  const q = document.getElementById('add-q').value.trim();
  const a = document.getElementById('add-a').value.trim();
  if (!section) { alert('Please name the section.'); return; }
  if (!q || !a) { alert('Please fill in both the question and the answer.'); return; }

  const card = { s: section, q, a };
  userCards.push(card);
  saveUserCards();
  const isNewSection = !ALL_SECTIONS.includes(section);
  if (isNewSection) activeSections.add(section);
  rebuildData();
  // If we're currently studying this section, drop the new card into the live deck.
  if (activeSections.has(section)) { deck.unshift(card); updateStats(); }
  closeAddModal();
}
function updateExportBtn() {
  const btn = document.getElementById('export-btn');
  if (!btn) return;
  btn.textContent = 'Export added cards (' + userCards.length + ')';
  btn.disabled = userCards.length === 0;
  btn.style.opacity = userCards.length === 0 ? '0.5' : '1';
}
function exportCards() {
  if (userCards.length === 0) { alert('No added cards to export yet.'); return; }
  const snippet = userCards.map(c =>
    '  {s:' + JSON.stringify(c.s) + ', q:' + JSON.stringify(c.q) + ', a:' + JSON.stringify(c.a) + '},'
  ).join('\n');
  const note = userCards.length + ' card(s) copied. Paste them into the ALL_CARDS list in flashcards.html (just before the closing ]) to make them permanent, then redeploy.';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(snippet).then(() => alert(note), () => window.prompt('Copy these cards:', snippet));
  } else {
    window.prompt('Copy these cards:', snippet);
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildFilterPanel();
updateExportBtn();
startRound(CARDS);
</script>
